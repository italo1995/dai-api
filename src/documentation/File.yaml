paths:
  /api/file/upload:
    post:
      summary: Sube uno o más archivos al servidor
      description: >
        Multipart/form-data. Guarda cada archivo recibido en uploads/temp/ con un nombre
        generado (uuid + timestamp) y devuelve las rutas relativas resultantes. No requiere
        un nombre de campo en particular, toma todos los archivos que vengan en el form.
      tags:
        - File
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Archivos subidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  code: { type: number }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      images:
                        type: array
                        items:
                          type: string
                        description: Rutas relativas de los archivos guardados (usar con /api/file/show)
  /api/file/show/{folder}/{fileName}:
    get:
      summary: Descarga un archivo previamente subido
      tags:
        - File
      parameters:
        - in: path
          name: folder
          required: true
          schema:
            type: string
        - in: path
          name: fileName
          required: true
          schema:
            type: string
      responses:
        '200':
          description: El archivo solicitado (descarga binaria, no JSON)
        '404':
          description: El archivo no existe en uploads/{folder}/{fileName}
tags:
  - File
