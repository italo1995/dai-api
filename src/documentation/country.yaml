components:
  schemas:
    Country:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Country id
            type: string
      properties:
        flag:
          description: the flag of the country
          type: string
        id:
          description: the id of the country
          type: number
        name:
          description: the name of the country
          type: string
        phone:
          description: the phone of the country
          type: string
        phoneCode:
          description: the phoneCode of the country
          type: string
        state:
          description: the state of the country
          type: boolean
      required:
      - id
      - name
      - state
      type: object
paths:
  /api/country/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of country
      tags:
      - Country
  /api/country/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/Country/parameters/id'
      responses:
        '201':
          description: The Country deleted
      security:
      - BearerAuth: []
      summary: Delete a country
      tags:
      - Country
  /api/country/show:
    get:
      parameters:
      - $ref: '#/components/schemas/Country/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Country'
                type: Array
          description: The list of country
      summary: Returns a country element
      tags:
      - Country
  /api/country/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  flag:
                    description: The flag of the country
                    type: string
                  name:
                    description: The name of the country
                    type: string
                  phone:
                    description: The phone of the country
                    type: string
                  phoneCode:
                    description: The phoneCode of the country
                    type: string
                  state:
                    description: The state of the country
                    type: boolean
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
          description: The country created
      security:
      - BearerAuth: []
      summary: Creates a new country
      tags:
      - Country
  /api/country/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  flag:
                    description: The flag of the country
                    type: string
                  id:
                    description: The id of the country
                    type: number
                  name:
                    description: The name of the country
                    type: string
                  phone:
                    description: The phone of the country
                    type: string
                  phoneCode:
                    description: The phoneCode of the country
                    type: string
                  state:
                    description: The state of the country
                    type: boolean
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
          description: The country updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - Country
tags:
- Country
