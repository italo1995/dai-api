components:
  schemas:
    CarData:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the CarData id
            type: string
      properties:
        icon:
          description: the icon of the carData
          type: string
        id:
          description: the id of the carData
          type: number
        isCar:
          description: the isCar of the carData
          type: boolean
        isMoto:
          description: the isMoto of the carData
          type: boolean
        name:
          description: the name of the carData
          type: string
        parentId:
          description: the parentId of the carData
          type: string | null
        type:
          description: the type of the carData
          type: ETypeReview
      required:
      - name
      - icon
      - type
      type: object
paths:
  /api/carData/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of carData
      tags:
      - CarData
  /api/carData/autoCreate:
    get:
      parameters:
      - $ref: '#/components/schemas/CarData/parameters/id'
      responses:
        '200':
          description: Success
      summary: Endpoint for autoCreate
      tags:
      - CarData
  /api/carData/brand/:brandId/models:
    get:
      parameters:
      - $ref: '#/components/schemas/CarData/parameters/id'
      responses:
        '200':
          description: Success
      summary: Endpoint for brand/:brandId/models
      tags:
      - CarData
  /api/carData/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/CarData/parameters/id'
      responses:
        '201':
          description: The CarData deleted
      security:
      - BearerAuth: []
      summary: Delete a carData
      tags:
      - CarData
  /api/carData/show:
    get:
      parameters:
      - $ref: '#/components/schemas/CarData/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CarData'
                type: Array
          description: The list of carData
      summary: Returns a carData element
      tags:
      - CarData
  /api/carData/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  icon:
                    description: The icon of the carData
                    type: string
                  isCar:
                    description: The isCar of the carData
                    type: boolean
                  isMoto:
                    description: The isMoto of the carData
                    type: boolean
                  name:
                    description: The name of the carData
                    type: string
                  type:
                    description: The type of the carData
                    type: ETypeReview
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - driverId
                - parentId
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarData'
          description: The carData created
      security:
      - BearerAuth: []
      summary: Creates a new carData
      tags:
      - CarData
  /api/carData/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  icon:
                    description: The icon of the carData
                    type: string
                  id:
                    description: The id of the carData
                    type: number
                  isCar:
                    description: The isCar of the carData
                    type: boolean
                  isMoto:
                    description: The isMoto of the carData
                    type: boolean
                  name:
                    description: The name of the carData
                    type: string
                  parentId:
                    description: The parentId of the carData
                    type: string | null
                  type:
                    description: The type of the carData
                    type: ETypeReview
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - driverId
                - parentId
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarData'
          description: The carData updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - CarData
tags:
- CarData
