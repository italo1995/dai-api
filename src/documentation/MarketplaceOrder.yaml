components:
  schemas:
    MarketplaceOrderItemModifier:
      type: object
      description: Modificador de un item, CONGELADO al momento de la compra (nombre y precio no se recalculan si el catalogo cambia despues)
      properties:
        id:
          type: number
        orderItemId:
          type: number
        modifierId:
          type: number
        name:
          type: string
        extraPrice:
          type: number
        quantity:
          type: number
    MarketplaceOrderItem:
      type: object
      description: Item del pedido, CONGELADO. productName/unitPrice/subtotal quedan tal cual estaban al crear el pedido - productId es solo referencia informativa
      properties:
        id:
          type: number
        orderId:
          type: number
        productId:
          type: number
        productName:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
          description: Precio de una unidad YA con modificadores incluidos
        subtotal:
          type: number
          description: unitPrice * quantity
        notes:
          type: string
          nullable: true
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceOrderItemModifier'
    MarketplaceOrder:
      type: object
      properties:
        id:
          type: number
        storeId:
          type: number
        customerId:
          type: string
        tripId:
          type: number
          nullable: true
          description: null hasta que arranca la busqueda de conductor. Se completa al despachar el pedido
        status:
          type: string
          enum:
            - pendiente de confirmacion
            - preparando pedido
            - buscando conductor
            - conductor asignado
            - pedido recogido
            - pedido entregado
            - cancelado
            - cancelacion solicitada
          description: >-
            Estado de NEGOCIO del pedido (distinto del status del trip, que es solo transporte).
            'cancelacion solicitada' es transitorio: lo pidio el cliente sobre un pedido ya
            confirmado (ver /cancelByClient) y esta pausado hasta que la tienda/admin lo acepte
            (-> cancelado) o lo rechace (-> vuelve a previousStatus)
        currencyId:
          type: number
          nullable: true
        couponId:
          type: number
          nullable: true
        discount:
          type: number
        deliveryFee:
          type: number
          description: 'Calculado server-side en /order/quote (distancia real via Google + tarifa de RangePrice) y fijado al crear el pedido via el quoteToken firmado - nunca se acepta un valor suelto del cliente'
        prepTimeMinutes:
          type: number
          nullable: true
          description: Minutos declarados por el comercio al confirmar (0-60). null hasta que confirma
        readyAt:
          type: string
          format: date-time
          nullable: true
          description: 'Cuando el pedido va a estar listo = hora de confirmacion + prepTimeMinutes'
        dispatchAt:
          type: string
          format: date-time
          nullable: true
          description: 'Cuando arranca la busqueda de conductor. prepTimeMinutes < 20 -> ahora; >= 20 -> readyAt - 15min. El scheduler lo mira para despachar'
        deliveryLat:
          type: number
          nullable: true
          description: Destino de la entrega (el origen es la tienda). Obligatorio al crear el pedido
        deliveryLon:
          type: number
          nullable: true
        deliveryAddress:
          type: string
          nullable: true
        cancellationReason:
          type: string
          nullable: true
          description: Motivo que dio el comercio al cancelar
        vehicle:
          type: string
          enum:
            - moto
            - car
          description: Vehiculo pedido para la entrega. Viene fijado adentro del quoteToken usado al crear el pedido
        paymentMethodId:
          type: number
          nullable: true
          description: 'Id de uno de los store_payment_methods activos de la tienda. Obligatorio al crear el pedido'
        paymentMethod:
          type: object
          nullable: true
          description: 'Resuelto (mismo objeto que StorePaymentMethod) - ver StorePaymentMethod.yaml. Incluido en /show y /all'
          properties:
            id:
              type: number
            type:
              type: string
            label:
              type: string
              nullable: true
            currencyId:
              type: number
              nullable: true
        referencePointText:
          type: string
          nullable: true
          description: Punto de referencia en texto libre para que el repartidor ubique la entrega (opcional)
        referencePhoto:
          type: string
          nullable: true
          description: Foto del punto de referencia (opcional). Se sube antes por /api/file/upload y se manda el path 'temp/...' devuelto
        previousStatus:
          type: string
          nullable: true
          description: 'Solo tiene valor mientras status = cancelacion solicitada: a que estado vuelve el pedido si se rechaza la solicitud'
        cancelRequestReason:
          type: string
          nullable: true
          description: Motivo que dio el CLIENTE al solicitar la cancelacion (distinto de cancellationReason, que es el motivo de la tienda)
        cancelRequestedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceOrderItem'
        store:
          type: object
          nullable: true
          properties:
            id:
              type: number
            name:
              type: string
            logo:
              type: string
              nullable: true
            type:
              type: string
              enum:
                - food
                - market
            lat:
              type: number
              nullable: true
            lon:
              type: number
              nullable: true
        customer:
          type: object
          nullable: true
          description: 'Solo en /show y /all'
          properties:
            id:
              type: string
            name:
              type: string
            phoneCode:
              type: string
            phoneNumber:
              type: string
        trip:
          type: object
          nullable: true
          description: 'El viaje asociado (null hasta que se despacha). Solo en /show y /all'
paths:
  /api/marketplace/order/checkVolume:
    get:
      summary: '[Cliente] Pregunta si un volumen de carrito entra en moto'
      description: >
        QA Sprint 3 #2/#6, fase B. La app suma el volumen de los productos del carrito
        (StoreProduct.volume) y manda el total acá. El tope se lee de Parámetros de la
        Empresa (name: 'motoMaxVolume', editable desde el panel admin, sin UI nueva). Si el
        parámetro no existe, devuelve allowed=true (sin restricción) en vez de fallar. No
        hay tope de volumen para carro todavía.
      tags:
        - Marketplace Order
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: volume
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Resultado del chequeo
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                    description: true = entra en moto, false = debe forzarse a carro
                  maxVolume:
                    type: number
                    nullable: true
                    description: El tope configurado (null si no hay ninguno configurado, en cuyo caso allowed siempre es true)
        '400':
          description: volume faltante o no es un numero valido
  /api/marketplace/order/quote:
    post:
      summary: '[Cliente] Cotiza el delivery del carrito activo - no crea nada'
      description: >
        Paso previo a /order/store. Calcula la distancia real de carretera (Google Distance
        Matrix, origen=tienda del carrito, destino=deliveryLat/deliveryLon) y el deliveryFee segun
        la tarifa de RangePrice configurada para la zona de la tienda (isDelivery=true). Devuelve
        el resumen para mostrar (productsTotal, discount, deliveryFee, grandTotal) mas un
        quoteToken firmado (JWT, vence en 10 minutos) que /order/store exige para crear el pedido -
        el deliveryFee nunca se acepta suelto del cliente, siempre sale de este token. Se puede
        llamar las veces que haga falta (cambia direccion, cambia vehicle) sin efecto secundario
        alguno - no toca el carrito ni crea nada.
      tags:
        - Marketplace Order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deliveryLat
                - deliveryLon
                - vehicle
              properties:
                deliveryLat:
                  type: number
                  description: A donde va la entrega. Se usa como destino para calcular la distancia
                deliveryLon:
                  type: number
                vehicle:
                  type: string
                  enum:
                    - moto
                    - car
      responses:
        '200':
          description: Cotizacion calculada
          content:
            application/json:
              schema:
                type: object
                properties:
                  productsTotal:
                    type: number
                  discount:
                    type: number
                  deliveryFee:
                    type: number
                  grandTotal:
                    type: number
                  distanceKm:
                    type: number
                    description: Distancia real de carretera, redondeada a 1 decimal
                  currency:
                    type: object
                    nullable: true
                  quoteToken:
                    type: string
                    description: JWT de 10 minutos - mandarlo tal cual en /order/store
        '400':
          description: 'Carrito vacio, con items no disponibles, cupon ya no valido, falta deliveryLat/deliveryLon, o vehicle invalido'
        '500':
          description: 'La tienda no tiene ubicacion configurada, no se pudo calcular la distancia (Google), o no hay tarifa de delivery configurada para la zona'
  /api/marketplace/order/store:
    post:
      summary: '[Cliente] Convierte el carrito activo en un pedido'
      description: >
        Toma el carrito del usuario (mismo calculo que cart/show) y lo CONGELA en el pedido:
        precios, modificadores, moneda, cupon y descuento quedan tal cual estaban. deliveryFee,
        vehicle y las coordenadas de entrega salen del quoteToken (obtenido antes via
        /order/quote), no del body. Ademas: descuenta stockQuantity de los productos con
        inventario (los marca no disponibles al llegar a 0), incrementa timesSold de todos, gasta
        el uso del cupon, y VACIA el carrito. Todo en una transaccion. Manda push al dueno de la
        tienda.
      tags:
        - Marketplace Order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quoteToken
                - paymentMethodId
              properties:
                quoteToken:
                  type: string
                  description: El que devolvio /order/quote - vence a los 10 minutos, y debe ser de la misma tienda/moneda que el carrito actual
                deliveryAddress:
                  type: string
                  description: Opcional, texto libre para mostrar (no afecta el calculo)
                paymentMethodId:
                  type: number
                  description: Id de un store_payment_method ACTIVO de la tienda del carrito (400 si no existe o es de otra tienda)
                referencePointText:
                  type: string
                  description: Opcional, texto libre
                referencePhoto:
                  type: string
                  description: Opcional. Subir antes por POST /api/file/upload (campo 'images') y mandar el path 'temp/...' que devuelve
      responses:
        '200':
          description: Pedido creado (status 'pendiente de confirmacion')
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceOrder'
        '400':
          description: 'Carrito vacio, o con items no disponibles, o cupon ya no valido, o sin stock suficiente, o quoteToken faltante/vencido/invalido, o el carrito cambio de tienda/moneda desde que se cotizo, o paymentMethodId faltante/inexistente/de otra tienda'
  /api/marketplace/order/confirm:
    post:
      summary: '[Comercio] Confirma el pedido y fija el tiempo de preparacion'
      description: >
        Solo desde 'pendiente de confirmacion'. Calcula readyAt (ahora + prepTimeMinutes) y
        dispatchAt (prepTimeMinutes < 20 -> ahora; >= 20 -> readyAt - 15min). El pedido pasa a
        'preparando pedido'. NO crea el viaje ni busca conductor todavia (eso lo hace el scheduler).
        Push al cliente con el tiempo estimado.
      tags:
        - Marketplace Order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
                - prepTimeMinutes
              properties:
                orderId:
                  type: number
                prepTimeMinutes:
                  type: number
                  description: Entero 0-60
      responses:
        '200':
          description: Pedido confirmado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceOrder'
        '400':
          description: prepTimeMinutes fuera de rango (0-60) o no entero
        '403':
          description: Un dueno (rolId 4) intento confirmar un pedido de otra tienda
        '409':
          description: El pedido no esta 'pendiente de confirmacion' (ya se confirmo o cancelo)
  /api/marketplace/order/markReady:
    post:
      summary: '[Comercio] Marca el pedido como listo antes de que se cumpla prepTimeMinutes'
      description: >
        Valido desde 'preparando pedido', 'buscando conductor' o 'conductor asignado'. Si todavia
        no se despacho (preparando), fuerza la busqueda de conductor ya mismo en vez de esperar a
        dispatchAt. Si ya hay un conductor asignado y en camino, solo le avisa por push que el
        pedido esta listo. Recorta readyAt a ahora si el tiempo estimado todavia no se cumplia.
        No hace nada si el pedido ya fue marcado como listo antes (idempotente).
      tags:
        - Marketplace Order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              properties:
                orderId:
                  type: number
      responses:
        '200':
          description: Pedido marcado como listo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceOrder'
        '403':
          description: Un dueno (rolId 4) intento marcar un pedido de otra tienda
        '409':
          description: El pedido no esta en un estado marcable como listo
  /api/marketplace/order/cancel:
    post:
      summary: '[Comercio] Cancela el pedido directamente (el cliente usa /cancelByClient)'
      description: >
        Solo el comercio (dueno rolId 4 de esa tienda, o admin/operador). Se permite cancelar hasta
        'conductor asignado' inclusive; desde 'pedido recogido' en adelante -> 409. Un pedido en
        'cancelacion solicitada' TAMPOCO se puede cancelar por aca (409) - esa solicitud del
        cliente se resuelve con /cancelRequest/accept o /cancelRequest/reject. Revierte
        inventario (stockQuantity y isAvailable), el contador timesSold y el uso del cupon; anula el
        viaje si estaba activo y libera al repartidor asignado. Push + socket 'marketplaceOrderCancelled'
        al cliente (y al repartidor si habia).
      tags:
        - Marketplace Order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              properties:
                orderId:
                  type: number
                reason:
                  type: string
                  description: Opcional, se muestra al cliente en el aviso
      responses:
        '200':
          description: Pedido cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceOrder'
        '403':
          description: No es el dueno de esa tienda ni admin/operador
        '409':
          description: El pedido ya no se puede cancelar (recogido, entregado, ya cancelado, o con una solicitud de cancelacion pendiente)
  /api/marketplace/order/cancelByClient:
    post:
      summary: '[Cliente] Cancela (si no esta confirmado) o solicita cancelar (si ya esta confirmado) su propio pedido'
      description: >
        El CLIENTE (dueño del pedido, rolId cliente) llama siempre a este mismo endpoint - el
        server decide internamente que hacer segun el status actual, la app no necesita saber la
        maquina de estados:
        - Si el pedido esta en 'pendiente de confirmacion' (la tienda todavia no lo reviso - en la
          practica, no hay nada "pagado" con metodos de pago manuales): se cancela DIRECTO, mismo
          efecto que /cancel del comercio. Avisa a la tienda.
        - Si ya esta en 'preparando pedido', 'buscando conductor' o 'conductor asignado' (ya
          confirmado): NO se cancela - el pedido pasa a 'cancelacion solicitada' (queda pausado,
          el scheduler de despacho lo ignora) y se avisa a la tienda y a todo admin/operador para
          que la revisen. El reembolso se coordina aparte, por mensaje o llamada, no lo hace el
          sistema.
        - Desde 'pedido recogido' en adelante (o si ya esta cancelado / ya hay una solicitud
          pendiente) -> 409, ni se puede cancelar ni solicitar.
      tags:
        - Marketplace Order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              properties:
                orderId:
                  type: number
                reason:
                  type: string
                  description: Opcional. Si no esta confirmado, es el motivo de cancelacion; si ya esta confirmado, es el motivo de la solicitud (cancelRequestReason)
      responses:
        '200':
          description: Pedido cancelado directo, o solicitud de cancelacion registrada - revisar el campo status de la respuesta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceOrder'
        '403':
          description: El pedido no es de este cliente
        '409':
          description: El pedido ya no se puede cancelar ni solicitar su cancelacion (recogido, entregado, cancelado, o ya hay una solicitud pendiente)
  /api/marketplace/order/cancelRequest/accept:
    post:
      summary: '[Comercio] Acepta la solicitud de cancelacion del cliente'
      description: >
        Solo el comercio (dueno de esa tienda, o admin/operador). El pedido tiene que estar en
        'cancelacion solicitada' (409 si no). Mismo efecto que /cancel (revierte inventario/cupon,
        anula viaje, libera repartidor) pero el motivo que queda registrado en cancellationReason
        es el que dio el CLIENTE al pedirla (cancelRequestReason). Avisa al cliente que la
        aceptaron y que van a coordinar el reembolso aparte.
      tags:
        - Marketplace Order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              properties:
                orderId:
                  type: number
      responses:
        '200':
          description: Pedido cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceOrder'
        '403':
          description: No es el dueno de esa tienda ni admin/operador
        '409':
          description: 'El pedido no tiene una solicitud de cancelacion pendiente (status != cancelacion solicitada)'
  /api/marketplace/order/cancelRequest/reject:
    post:
      summary: '[Comercio] Rechaza la solicitud de cancelacion del cliente'
      description: >
        Solo el comercio (dueno de esa tienda, o admin/operador). El pedido tiene que estar en
        'cancelacion solicitada' (409 si no). Vuelve al status que tenia antes de la solicitud
        (previousStatus) - no revierte nada porque nunca se llego a tocar inventario/cupon/viaje.
        Avisa al cliente que la rechazaron y que su pedido sigue en curso.
      tags:
        - Marketplace Order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              properties:
                orderId:
                  type: number
      responses:
        '200':
          description: Pedido restaurado a su estado anterior
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceOrder'
        '403':
          description: No es el dueno de esa tienda ni admin/operador
        '409':
          description: 'El pedido no tiene una solicitud de cancelacion pendiente (status != cancelacion solicitada)'
  /api/marketplace/order/nearbyPending:
    get:
      summary: '[Repartidor] Pedidos buscando conductor cerca de su ubicacion actual'
      description: >
        Respaldo "pull" para cuando el aviso por socket ('newMarketplaceOrder') no le llega al
        repartidor (reconexion, push perdido, app recien abierta). Usa exactamente el mismo
        criterio de elegibilidad que el despacho automatico: el conductor tiene que estar activo
        y verificado, y habilitado (dai_food / dai_market) para el tipo de cada tienda - si no
        cumple, o no esta habilitado para ningun tipo, devuelve un array vacio en vez de error.
        Solo devuelve pedidos en 'buscando conductor' (con viaje ya creado, sin conductor
        asignado todavia) dentro del radio pedido.
      tags:
        - Marketplace Order
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
          description: Latitud actual del conductor
        - in: query
          name: lon
          required: true
          schema:
            type: number
          description: Longitud actual del conductor
        - in: query
          name: distance
          required: false
          schema:
            type: number
            default: 15
          description: Radio de busqueda en km (default 15, igual que el despacho automatico)
      responses:
        '200':
          description: Pedidos disponibles cerca, ordenados por distancia ascendente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    orderId:
                      type: number
                    tripId:
                      type: number
                    store:
                      type: object
                      properties:
                        id:
                          type: number
                        name:
                          type: string
                        logo:
                          type: string
                          nullable: true
                        type:
                          type: string
                          enum:
                            - food
                            - market
                    deliveryFee:
                      type: number
                    distanceKm:
                      type: number
        '400':
          description: Falta lat/lon o no son numeros validos
        '403':
          description: El que pregunta no es un conductor
  /api/marketplace/order/all:
    get:
      summary: 'Listado de pedidos, con la vista que corresponde a quien pregunta'
      description: >
        Cualquier usuario logueado. El scoping lo hace el server: el cliente ve sus pedidos, el
        repartidor los que tiene asignados, el dueno de comercio los de sus tiendas, admin/operador
        todos (con filtro opcional storeId). Filtro comun opcional: status. Paginacion con pag +
        limit (mismo patron que el resto de la API).
      tags:
        - Marketplace Order
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: pag
          schema:
            type: number
          description: Si se manda, la respuesta viene paginada (total/totalPage/actualPage/data). Si no, array plano
        - in: query
          name: limit
          schema:
            type: number
            default: 10
        - in: query
          name: status
          schema:
            type: string
          description: 'Filtra por estado (ej: "preparando pedido")'
        - in: query
          name: storeId
          schema:
            type: number
          description: 'Solo lo usa admin/operador - filtra por tienda'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/MarketplaceOrder'
                  - type: object
                    properties:
                      total:
                        type: number
                      totalPage:
                        type: number
                      actualPage:
                        type: number
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MarketplaceOrder'
  /api/marketplace/order/show:
    get:
      summary: 'Detalle de un pedido (con scoping por rol)'
      description: 'Devuelve el pedido completo (items + modificadores + store + customer + trip). 403 si al que pregunta no le corresponde ese pedido'
      tags:
        - Marketplace Order
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceOrder'
        '403':
          description: El pedido no es del cliente, ni de su tienda, ni le fue asignado (y no es admin/operador)
        '404':
          description: El pedido no existe
