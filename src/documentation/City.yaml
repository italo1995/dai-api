components:
  schemas:
    City:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the City id
            type: string
      properties:
        flag:
          description: the flag of the city
          type: string
        id:
          description: the id of the city
          type: number
        name:
          description: the name of the city
          type: string
        phone:
          description: the phone of the city
          type: string
        regionId:
          description: the regionId of the city
          type: number | null
        state:
          description: the state of the city
          type: boolean
      required:
      - id
      - name
      - regionId
      - state
      type: object
paths:
  /api/city/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of city
      tags:
      - City
  /api/city/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/City/parameters/id'
      responses:
        '201':
          description: The City deleted
      security:
      - BearerAuth: []
      summary: Delete a city
      tags:
      - City
  /api/city/show:
    get:
      parameters:
      - $ref: '#/components/schemas/City/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/City'
                type: Array
          description: The list of city
      summary: Returns a city element
      tags:
      - City
  /api/city/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  flag:
                    description: The flag of the city
                    type: string
                  name:
                    description: The name of the city
                    type: string
                  phone:
                    description: The phone of the city
                    type: string
                  state:
                    description: The state of the city
                    type: boolean
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
          description: The city created
      security:
      - BearerAuth: []
      summary: Creates a new city
      tags:
      - City
  /api/city/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  flag:
                    description: The flag of the city
                    type: string
                  id:
                    description: The id of the city
                    type: number
                  name:
                    description: The name of the city
                    type: string
                  phone:
                    description: The phone of the city
                    type: string
                  regionId:
                    description: The regionId of the city
                    type: number | null
                  state:
                    description: The state of the city
                    type: boolean
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
          description: The city updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - City
tags:
- City
