components:
  schemas:
    DataContent:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the DataContent id
            type: string
      properties:
        description:
          description: the description of the dataContent
          type: string
        id:
          description: the id of the dataContent
          type: number
        image:
          description: the image of the dataContent
          type: string
        name:
          description: the name of the dataContent
          type: string
        orden:
          description: the orden of the dataContent
          type: number
        type:
          description: the type of the dataContent
          type: ETypeReview
      required:
      - id
      - name
      - description
      - type
      type: object
paths:
  /api/dataContent/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of dataContent
      tags:
      - DataContent
  /api/dataContent/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/DataContent/parameters/id'
      responses:
        '201':
          description: The DataContent deleted
      security:
      - BearerAuth: []
      summary: Delete a dataContent
      tags:
      - DataContent
  /api/dataContent/show:
    get:
      parameters:
      - $ref: '#/components/schemas/DataContent/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DataContent'
                type: Array
          description: The list of dataContent
      summary: Returns a dataContent element
      tags:
      - DataContent
  /api/dataContent/showType:
    get:
      parameters:
      - $ref: '#/components/schemas/DataContent/parameters/id'
      responses:
        '200':
          description: Success
      summary: Endpoint for showType
      tags:
      - DataContent
  /api/dataContent/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  description:
                    description: The description of the dataContent
                    type: string
                  image:
                    description: The image of the dataContent
                    type: string
                  name:
                    description: The name of the dataContent
                    type: string
                  orden:
                    description: The orden of the dataContent
                    type: number
                  type:
                    description: The type of the dataContent
                    type: ETypeReview
                required:
                - id
                - name
                - description
                - type
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContent'
          description: The dataContent created
      security:
      - BearerAuth: []
      summary: Creates a new dataContent
      tags:
      - DataContent
  /api/dataContent/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  description:
                    description: The description of the dataContent
                    type: string
                  id:
                    description: The id of the dataContent
                    type: number
                  image:
                    description: The image of the dataContent
                    type: string
                  name:
                    description: The name of the dataContent
                    type: string
                  orden:
                    description: The orden of the dataContent
                    type: number
                  type:
                    description: The type of the dataContent
                    type: ETypeReview
                required:
                - id
                - name
                - description
                - type
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContent'
          description: The dataContent updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - DataContent
tags:
- DataContent
