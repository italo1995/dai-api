components:
 schemas:
   Term:
     type: object
     properties:
       id:
         type: number
         description: the auto-increment id of Term
       name:
         type: string
         description: the name of the Term
       description: 
         type: string
         description: the description of the Term
       orden:
         type: number
         description: el orden
     required:
       - name
       - description
     example:
       id: 1
       name: termino 1
       description: Esto es un termino y condicion
     parameters:
      id:
       in: query
       name: id
       required: true
       schema:
        type: string
        description: the Term id
tags:
  - name: Term
    description: Term endpoint
paths:
  /api/term/show:
    get:
      summary: Returns a Term element
      tags:
        - Term
      parameters:
        - $ref: '#/components/schemas/Term/parameters/id'
      responses:
        '200':
          description: the term element
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Term'
  /api/term/all:
    get:
      summary: Returns a list of Term
      tags:
        - Term
      parameters:
        - in: query
          name: pag
          schema:
            type: number
          description: the page number to fetch
        - in: query
          name: search
          schema:
            type: string
          description: the keyword to filter by name
      responses:
        '200':
          description: the list of Term
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Term'
  /api/term/store:
    post:
      security:
      - BearerAuth: []
      summary: Creates a new Term
      tags:
        - Term
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: the name of the Term
                description:
                  type: string
                  description: the link of the Term
                orden:
                  type: number
                  description: the orden of the Term
              required:
                - name
                - image
                - description
              example:
                name: Esto es un termino
                description: Aca va el contenido que podria ser un html <h1>Soy un titulo</h1>
                orden: 1
      responses:
        '201':
          description: the Term created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
  /api/term/update:
    post:
      security:
      - BearerAuth: []
      summary: Updates a Term
      tags:
        - Term
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: the name of the Term
                description:
                  type: string
                  description: the description of the Term
                orden:
                  type: number
                  description: the orden of the Term
              required:
                - id
              example:
                id: 1
                name: Esto es un termino
                description: Aca va el contenido que podria ser un html <h1>Soy un titulo</h1>
                orden: 1
      responses:
        '201':
          description: the Term updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
