components:
  schemas:
    Term:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Term id
            type: string
      properties:
        description:
          description: the description of the term
          type: string
        id:
          description: the id of the term
          type: number
        name:
          description: the name of the term
          type: string
        orden:
          description: the orden of the term
          type: number
      required:
      - id
      - name
      - description
      type: object
paths:
  /api/term/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of term
      tags:
      - Term
  /api/term/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/Term/parameters/id'
      responses:
        '201':
          description: The Term deleted
      security:
      - BearerAuth: []
      summary: Delete a term
      tags:
      - Term
  /api/term/show:
    get:
      parameters:
      - $ref: '#/components/schemas/Term/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Term'
                type: Array
          description: The list of term
      summary: Returns a term element
      tags:
      - Term
  /api/term/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  description:
                    description: The description of the term
                    type: string
                  name:
                    description: The name of the term
                    type: string
                  orden:
                    description: The orden of the term
                    type: number
                required:
                - id
                - name
                - description
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
          description: The term created
      security:
      - BearerAuth: []
      summary: Creates a new term
      tags:
      - Term
  /api/term/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  description:
                    description: The description of the term
                    type: string
                  id:
                    description: The id of the term
                    type: number
                  name:
                    description: The name of the term
                    type: string
                  orden:
                    description: The orden of the term
                    type: number
                required:
                - id
                - name
                - description
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
          description: The term updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - Term
tags:
- Term
