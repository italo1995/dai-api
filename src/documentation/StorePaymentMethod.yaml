components:
  schemas:
    StorePaymentMethod:
      type: object
      properties:
        id:
          type: number
        storeId:
          type: number
        type:
          type: string
          enum:
            - efectivo
            - transferencia
            - zelle
            - nequi
            - pago_movil
            - otro
          description: No es el mismo catalogo que PaymentMethod (ese es global, del modulo de traslados) - cada tienda arma su propia lista dinamica
        label:
          type: string
          nullable: true
          description: 'Detalle libre opcional (ej: "Banco Mercantil" para transferencia, o el nombre real cuando type=otro)'
        currencyId:
          type: number
          nullable: true
          description: >-
            Moneda en la que se cobra con este metodo (ej: zelle -> USD, pago_movil -> Bolivar).
            Opcional - un metodo como efectivo puede no atarse a una sola moneda. Si una tienda
            acepta el mismo tipo de metodo en mas de una moneda (ej: efectivo en USD y en
            Bolivares), se crean dos filas separadas, una por moneda (no hay restriccion de
            unicidad por type).
        currency:
          type: object
          nullable: true
          description: Moneda ya resuelta (id, name, symbol) - incluido en show/all/allAdmin, no requiere un llamado aparte a currency/all
          properties:
            id:
              type: number
            name:
              type: string
            symbol:
              type: string
        iconId:
          type: number
          nullable: true
          description: 'Id de un icono generico de la libreria (ver MediaLibraryItem.yaml, type=payment_method). Alternativa a customIcon - se usa uno u otro'
        icon:
          type: object
          nullable: true
          description: Icono generico ya resuelto (id, name, image) - incluido en show/all/allAdmin. null si no eligio ninguno o si subio uno propio (customIcon)
          properties:
            id:
              type: number
            name:
              type: string
            image:
              type: string
        customIcon:
          type: string
          nullable: true
          description: >-
            Icono propio de esta tienda para este metodo puntual (no generico) - alternativa a
            iconId. Se sube antes por POST /api/file/upload y se manda el path 'temp/...' devuelto
        isActive:
          type: boolean
paths:
  /api/storePaymentMethod/show:
    get:
      summary: Trae un metodo de pago de tienda por id
      tags:
        - StorePaymentMethod
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Success
  /api/storePaymentMethod/all:
    get:
      summary: Lista los metodos de pago que acepta una tienda
      description: Publico, no tiene datos sensibles
      tags:
        - StorePaymentMethod
      parameters:
        - in: query
          name: storeId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Success
  /api/storePaymentMethod/allAdmin:
    get:
      summary: Lista para el panel (admin/operator o dueño de la tienda)
      tags:
        - StorePaymentMethod
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success
  /api/storePaymentMethod/store:
    post:
      summary: Agrega un metodo de pago a una tienda
      description: El dueño solo puede agregar a una tienda propia
      tags:
        - StorePaymentMethod
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - storeId
                - type
              properties:
                storeId:
                  type: number
                type:
                  type: string
                  enum:
                    - efectivo
                    - transferencia
                    - zelle
                    - nequi
                    - pago_movil
                    - otro
                label:
                  type: string
                currencyId:
                  type: number
                  nullable: true
                iconId:
                  type: number
                  nullable: true
                  description: 'Id de un icono generico de la libreria (ver MediaLibraryItem.yaml). No mandar junto con customIcon'
                customIcon:
                  type: string
                  nullable: true
                  description: "Path 'temp/...' de un icono propio, subido antes por /api/file/upload. No mandar junto con iconId"
                isActive:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Success
        '403':
          description: Acceso denegado
  /api/storePaymentMethod/update:
    post:
      summary: Actualiza un metodo de pago de tienda
      description: storeId no se puede cambiar - un metodo de pago no cambia de tienda
      tags:
        - StorePaymentMethod
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePaymentMethod'
      responses:
        '200':
          description: Success
  /api/storePaymentMethod/delete:
    post:
      summary: Elimina (soft delete) un metodo de pago de tienda
      tags:
        - StorePaymentMethod
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
      responses:
        '200':
          description: Success
tags:
  - name: StorePaymentMethod
    description: Metodos de pago que una tienda acepta - lista dinamica por comercio, sin relacion con el catalogo global PaymentMethod del modulo de traslados
