components:
  schemas:
    Branch:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Branch id
            type: string
      properties:
        countryId:
          description: the countryId of the branch
          type: number
        direction:
          description: the direction of the branch
          type: string
        email:
          description: the email of the branch
          type: string
        id:
          description: the id of the branch
          type: string
        image:
          description: the image of the branch
          type: string
        lat:
          description: the lat of the branch
          type: string
        lon:
          description: the lon of the branch
          type: string
        name:
          description: the name of the branch
          type: string
        number:
          description: the number of the branch
          type: string
        referencePoint:
          description: the referencePoint of the branch
          type: string
      required:
      - id
      - name
      - number
      - direction
      type: object
paths:
  /api/branch/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of branch
      tags:
      - Branch
  /api/branch/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/Branch/parameters/id'
      responses:
        '201':
          description: The Branch deleted
      security:
      - BearerAuth: []
      summary: Delete a branch
      tags:
      - Branch
  /api/branch/show:
    get:
      parameters:
      - $ref: '#/components/schemas/Branch/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Branch'
                type: Array
          description: The list of branch
      summary: Returns a branch element
      tags:
      - Branch
  /api/branch/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  direction:
                    description: The direction of the branch
                    type: string
                  email:
                    description: The email of the branch
                    type: string
                  image:
                    description: The image of the branch
                    type: string
                  lat:
                    description: The lat of the branch
                    type: string
                  lon:
                    description: The lon of the branch
                    type: string
                  name:
                    description: The name of the branch
                    type: string
                  number:
                    description: The number of the branch
                    type: string
                  referencePoint:
                    description: The referencePoint of the branch
                    type: string
                required:
                - currencyId
                - image
                - name
                - dni
                - accountType
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: The branch created
      security:
      - BearerAuth: []
      summary: Creates a new branch
      tags:
      - Branch
  /api/branch/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  countryId:
                    description: The countryId of the branch
                    type: number
                  direction:
                    description: The direction of the branch
                    type: string
                  email:
                    description: The email of the branch
                    type: string
                  id:
                    description: The id of the branch
                    type: string
                  image:
                    description: The image of the branch
                    type: string
                  lat:
                    description: The lat of the branch
                    type: string
                  lon:
                    description: The lon of the branch
                    type: string
                  name:
                    description: The name of the branch
                    type: string
                  number:
                    description: The number of the branch
                    type: string
                  referencePoint:
                    description: The referencePoint of the branch
                    type: string
                required:
                - currencyId
                - image
                - name
                - dni
                - accountType
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: The branch updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - Branch
tags:
- Branch
