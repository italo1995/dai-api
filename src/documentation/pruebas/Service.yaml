components:
  schemas:
    Service:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Service id
            type: string
      properties:
        description:
          description: the description of the Service
          type: string
        id:
          description: the id of the Service
          type: string
        image:
          description: the image of the Service
          type: string
        name:
          description: the name of the Service
          type: string
        state?:
          description: the state? of the Service
          type: string
      required:
      - id
      - name
      - image
      - description
      type: object
