components:
  schemas:
    Bank:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Bank id
            type: string
      properties:
        accountNumber:
          description: the accountNumber of the bank
          type: string
        accountType:
          description: the accountType of the bank
          type: string
        currencyId:
          description: the currencyId of the bank
          type: number
        dni:
          description: the dni of the bank
          type: string
        email:
          description: the email of the bank
          type: string
        fullName:
          description: the fullName of the bank
          type: string
        hasCapture:
          description: the hasCapture of the bank
          type: boolean
        icon:
          description: the icon of the bank
          type: string
        id:
          description: the id of the bank
          type: string
        isConvert:
          description: the isConvert of the bank
          type: boolean
        name:
          description: the name of the bank
          type: string
        phoneNumber:
          description: the phoneNumber of the bank
          type: string
      required:
      - id
      - name
      - fullName
      - dni
      - accountType
      type: object
paths:
  /api/bank/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of bank
      tags:
      - Bank
  /api/bank/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/Bank/parameters/id'
      responses:
        '201':
          description: The Bank deleted
      security:
      - BearerAuth: []
      summary: Delete a bank
      tags:
      - Bank
  /api/bank/show:
    get:
      parameters:
      - $ref: '#/components/schemas/Bank/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Bank'
                type: Array
          description: The list of bank
      summary: Returns a bank element
      tags:
      - Bank
  /api/bank/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  accountNumber:
                    description: The accountNumber of the bank
                    type: string
                  accountType:
                    description: The accountType of the bank
                    type: string
                  dni:
                    description: The dni of the bank
                    type: string
                  email:
                    description: The email of the bank
                    type: string
                  fullName:
                    description: The fullName of the bank
                    type: string
                  hasCapture:
                    description: The hasCapture of the bank
                    type: boolean
                  icon:
                    description: The icon of the bank
                    type: string
                  isConvert:
                    description: The isConvert of the bank
                    type: boolean
                  name:
                    description: The name of the bank
                    type: string
                  phoneNumber:
                    description: The phoneNumber of the bank
                    type: string
                required:
                - currencyId
                - image
                - name
                - dni
                - accountType
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bank'
          description: The bank created
      security:
      - BearerAuth: []
      summary: Creates a new bank
      tags:
      - Bank
  /api/bank/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  accountNumber:
                    description: The accountNumber of the bank
                    type: string
                  accountType:
                    description: The accountType of the bank
                    type: string
                  currencyId:
                    description: The currencyId of the bank
                    type: number
                  dni:
                    description: The dni of the bank
                    type: string
                  email:
                    description: The email of the bank
                    type: string
                  fullName:
                    description: The fullName of the bank
                    type: string
                  hasCapture:
                    description: The hasCapture of the bank
                    type: boolean
                  icon:
                    description: The icon of the bank
                    type: string
                  id:
                    description: The id of the bank
                    type: string
                  isConvert:
                    description: The isConvert of the bank
                    type: boolean
                  name:
                    description: The name of the bank
                    type: string
                  phoneNumber:
                    description: The phoneNumber of the bank
                    type: string
                required:
                - currencyId
                - image
                - name
                - dni
                - accountType
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bank'
          description: The bank updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - Bank
tags:
- Bank
