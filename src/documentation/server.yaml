components:
  schemas:
    Server:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Server id
            type: string
      properties: {}
      required: []
      type: object
paths:
  /api/server/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of server
      tags:
      - Server
  /api/server/show:
    get:
      parameters:
      - $ref: '#/components/schemas/Server/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Server'
                type: Array
          description: The list of server
      summary: Returns a server element
      tags:
      - Server
  /api/server/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property: {}
                required: []
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
          description: The server created
      security:
      - BearerAuth: []
      summary: Creates a new server
      tags:
      - Server
  /api/server/update:
    get:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property: {}
                required: []
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
          description: The server updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - Server
tags:
- Server
