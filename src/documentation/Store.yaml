components:
  schemas:
    Store:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        type:
          type: string
          enum:
            - food
            - market
        ownerId:
          type: string
        phoneCode:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        banner:
          type: string
          nullable: true
          description: Imagen de portada que se muestra al abrir la tienda (store/show) en la app. Distinta del logo, que se usa en los listados
        description:
          type: string
          nullable: true
          description: Descripcion de la tienda, se muestra al abrir la tienda en la app
        lat:
          type: number
          nullable: true
        lon:
          type: number
          nullable: true
        cityId:
          type: number
          nullable: true
        regionId:
          type: number
          nullable: true
        countryId:
          type: number
          nullable: true
        isOpen:
          type: boolean
        isApproved:
          type: boolean
          nullable: true
          description: 'null = pendiente de revision, true = aprobada, false = rechazada'
        rejectionReason:
          type: string
          nullable: true
        avgPrepTimeMinutes:
          type: number
          nullable: true
        businessCategoryIds:
          type: array
          items:
            type: number
          description: 'Al crear/editar: ids de BusinessCategory a asignar. Requerido, minimo 1, y todos deben ser del mismo type que la tienda'
    StorePublic:
      type: object
      description: Shape que devuelven /api/store/all y /api/store/show cuando quien pregunta no es el dueño ni admin/operator
      properties:
        id:
          type: number
        name:
          type: string
        type:
          type: string
          enum:
            - food
            - market
        logo:
          type: string
          nullable: true
        banner:
          type: string
          nullable: true
          description: Imagen de portada que se muestra al abrir la tienda en la app (store/show). Distinta del logo, que se usa en los listados
        description:
          type: string
          nullable: true
          description: Descripcion de la tienda, se muestra al abrir la tienda en la app
        lat:
          type: number
          nullable: true
        lon:
          type: number
          nullable: true
        cityId:
          type: number
          nullable: true
        isOpen:
          type: boolean
        avgPrepTimeMinutes:
          type: number
          nullable: true
        avgRating:
          type: number
          description: Denormalizado desde store_ratings, nunca supera 5
        ratingCount:
          type: number
        businessCategories:
          type: array
          items:
            type: object
            properties:
              id:
                type: number
              name:
                type: string
        isFavorite:
          type: boolean
          description: Solo presente si la request trae un JWT valido (Authorization header). Sin sesion, esta clave no aparece en la respuesta
        distanceKm:
          type: number
          description: Solo presente si la request mando lat y lon - distancia en linea recta en kilometros
paths:
  /api/store/all:
    get:
      summary: Lista publica de tiendas aprobadas, paginada (uso app)
      description: 'Solo tiendas con isApproved=true, con los campos minimos para renderizar (sin timestamps, sin datos administrativos). Respuesta paginada: total, totalPage, actualPage, data (array de StorePublic)'
      tags:
        - Store
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum:
              - food
              - market
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: 'Busca por nombre de tienda O por nombre de producto vendido (contiene, sin importar mayusculas) - ej: "hamburguesa" trae tanto tiendas que se llamen asi como tiendas que vendan un producto disponible con ese nombre'
        - in: query
          name: categoryId
          required: false
          schema:
            type: string
          description: 'Uno o varios ids de BusinessCategory separados por coma (ej: 1,3). Trae tiendas que tengan al menos una'
        - in: query
          name: lat
          required: false
          schema:
            type: number
          description: 'Latitud del cliente. Si se manda junto con lon, filtra tiendas dentro de radiusKm (independiente de orderBy). Tiendas sin lat/lon cargado quedan afuera del filtro de radio'
        - in: query
          name: lon
          required: false
          schema:
            type: number
          description: Longitud del cliente. Ver lat
        - in: query
          name: radiusKm
          required: false
          schema:
            type: number
            default: 15
          description: Solo aplica si se mando lat/lon. Radio de busqueda en kilometros
        - in: query
          name: orderBy
          required: false
          schema:
            type: string
            enum:
              - relevance
              - rating
              - distance
            default: 'relevance (o distance si se mando lat/lon)'
          description: 'Orden del resultado. relevance = el de siempre (mas nuevas primero). rating = por avgRating descendente. distance = por distanceKm ascendente, requiere lat/lon (si se pide distance sin mandarlos, cae a relevance en silencio en vez de dar error). Si no se manda orderBy pero SI se manda lat/lon, el default pasa a ser distance (mismo comportamiento que antes de que existiera este parametro)'
        - in: query
          name: limit
          required: false
          schema:
            type: number
            default: 10
        - in: query
          name: page
          required: false
          schema:
            type: number
            default: 1
      responses:
        '200':
          description: Success
  /api/store/show:
    get:
      summary: Trae una tienda por id
      description: Publica si esta aprobada. Si no, solo la puede ver el dueño o un admin/operator autenticado
      tags:
        - Store
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Success
        '403':
          description: Acceso denegado
  /api/store/allAdmin:
    get:
      summary: Lista de tiendas para el panel
      description: Si el usuario autenticado tiene rol 'store' (rolId 4), devuelve solo sus propias tiendas. Si es admin/operator, devuelve todas, con filtro opcional por estado de aprobacion (?isApproved=true|false|pending)
      tags:
        - Store
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success
  /api/store/store:
    post:
      summary: Crea una tienda
      description: Si el usuario autenticado es rol 'store', ownerId se fuerza al propio usuario (no se puede crear a nombre de otro). Admin/operator debe enviar ownerId explicitamente. Queda con isApproved=null (pendiente)
      tags:
        - Store
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Store'
      responses:
        '200':
          description: Success
  /api/store/update:
    post:
      summary: Actualiza una tienda
      description: El dueño solo puede editar sus propias tiendas, y no puede modificar isApproved/rejectionReason/ownerId desde este endpoint (usar /approve o /reject)
      tags:
        - Store
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Store'
      responses:
        '200':
          description: Success
        '403':
          description: Acceso denegado (no es el dueño)
  /api/store/delete:
    post:
      summary: Elimina (soft delete) una tienda
      description: El dueño solo puede borrar sus propias tiendas. Admin/operator, cualquiera
      tags:
        - Store
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
      responses:
        '200':
          description: Success
  /api/store/approve:
    post:
      summary: Aprueba una tienda (solo admin/operator)
      description: Marca isApproved=true y limpia rejectionReason. A partir de este momento la tienda aparece en /api/store/all
      tags:
        - Store
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
      responses:
        '200':
          description: Success
  /api/store/reject:
    post:
      summary: Rechaza una tienda (solo admin/operator)
      description: Marca isApproved=false y guarda el motivo. rejectionReason es obligatorio
      tags:
        - Store
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - rejectionReason
              properties:
                id:
                  type: number
                rejectionReason:
                  type: string
      responses:
        '200':
          description: Success
        '500':
          description: rejectionReason es requerido
tags:
  - name: Store
    description: Tiendas/comercios del Marketplace (DAI Food / DAI Market). Requieren aprobacion de un admin antes de ser visibles en la app.
