components:
 schemas:
   Verify:
     type: object
     properties:
       id:
         type: number
         description: the auto-increment id of the verify
       userId:
         type: string
         description: the user's id
       appeal:
         type: string
         description: a field for appeals
       reason:
         type: string
         description: the reason for not verifying
       status:
         type: enum
         description: de verifying status (verified = 1, verifying = 2, denied = 3)
     required:
       - userId
       - status
     example:
       id: 1
       userId: 123
       status: verified
     parameters:
      id:
       in: query
       name: id
       required: true
       schema:
        type: string
        description: the verify id
tags:
  - name: Verify
    description: Verify endpoint
paths:
  /api/verify/show:
    get:
      summary: Returns a verify element
      tags:
        - Verify
      parameters:
        - $ref: '#/components/schemas/Verify/parameters/id'
      responses:
        '200':
          description: the verify element
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verify'
  /api/verify/all:
    get:
      summary: Returns a list of verifies
      tags:
        - Verify
      parameters:
        - in: query
          name: pag
          schema:
            type: number
          description: the page number to fetch
        - in: query
          name: search
          schema:
            type: string
          description: the keyword to filter by name
      responses:
        '200':
          description: the list of Verify
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verify'
  /api/verify/store:
    post:
      summary: Creates a new Verify
      tags:
        - Verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: the user's id
                appeal:
                  type: string
                  description: a field for appeals
                reason:
                  type: string
                  description: the reason for not verifying
                status:
                  type: enum
                  description: de verifying status (verified = 1, verifying = 2, denied = 3)
              required:
                - userId
                - status
              example:
                id: 1
                userId: 123
                status: verified
      responses:
        '201':
          description: the Verify created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verify'
  /api/verify/update:
    post:
      summary: Updates a verify and verifies a driver setting verifiedDriver to true
      tags:
        - Verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: the user's id
                appeal:
                  type: string
                  description: a field for appeals
                reason:
                  type: string
                  description: the reason for not verifying
                status:
                  type: enum
                  description: de verifying status (verified = 1, verifying = 2, denied = 3)
              required:
                - userId
                - status
              example:
                id: 1
                userId: 123
                status: verified
      responses:
        '201':
          description: the verify updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verify'
