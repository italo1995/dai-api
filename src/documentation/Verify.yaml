components:
  schemas:
    Verify:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Verify id
            type: string
      properties:
        appeal:
          description: the appeal of the verify
          type: string
        id:
          description: the id of the verify
          type: number
        reason:
          description: the reason of the verify
          type: string
        status:
          description: the status of the verify
          type: EStatusVerify
        userId:
          description: the userId of the verify
          type: string
      required:
      - id
      - userId
      - status
      type: object
paths:
  /api/verify/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Verify'
                type: Array
          description: The list of verify
      summary: Returns a list of verify
      tags:
      - Verify
  /api/verify/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/Verify/parameters/id'
      responses:
        '201':
          description: The Verify deleted
      security:
      - BearerAuth: []
      summary: Delete a verify
      tags:
      - Verify
  /api/verify/show:
    get:
      parameters:
      - $ref: '#/components/schemas/Verify/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Verify'
                type: Array
          description: The element of verify
      summary: Returns a verify element
      tags:
      - Verify
  /api/verify/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  appeal:
                    description: The appeal of the verify
                    type: string
                  reason:
                    description: The reason of the verify
                    type: string
                  status:
                    description: The status of the verify
                    type: EStatusVerify
                required:
                - id
                - userId
                - status
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verify'
          description: The verify created
      security:
      - BearerAuth: []
      summary: Creates a new verify
      tags:
      - Verify
  /api/verify/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  appeal:
                    description: The appeal of the verify
                    type: string
                  id:
                    description: The id of the verify
                    type: number
                  reason:
                    description: The reason of the verify
                    type: string
                  status:
                    description: The status of the verify
                    type: EStatusVerify
                  userId:
                    description: The userId of the verify
                    type: string
                required:
                - id
                - userId
                - status
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verify'
          description: The verify updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - Verify
tags:
- Verify
