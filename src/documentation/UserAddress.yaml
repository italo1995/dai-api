components:
  schemas:
    UserAddress:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the UserAddress id
            type: string
      properties:
        address:
          description: the address of the userAddress
          type: string
        file:
          description: the file of the userAddress
          type: string
        id:
          description: the id of the userAddress
          type: number
        lat:
          description: the lat of the userAddress
          type: number | null
        lon:
          description: the lon of the userAddress
          type: number | null
        name:
          description: the name of the userAddress
          type: string
        reference:
          description: the reference of the userAddress
          type: string
        userId:
          description: the userId of the userAddress
          type: string
      required:
      - id
      - userId
      - name
      - address
      - reference
      - lat
      - lon
      type: object
paths:
  /api/userAddress/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of userAddress
      tags:
      - UserAddress
  /api/userAddress/destroy:
    post:
      parameters:
      - $ref: '#/components/schemas/UserAddress/parameters/id'
      responses:
        '200':
          description: Success
      security:
      - BearerAuth: []
      summary: Endpoint for destroy
      tags:
      - UserAddress
  /api/userAddress/show:
    get:
      parameters:
      - $ref: '#/components/schemas/UserAddress/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserAddress'
                type: Array
          description: The list of userAddress
      summary: Returns a userAddress element
      tags:
      - UserAddress
  /api/userAddress/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  address:
                    description: The address of the userAddress
                    type: string
                  file:
                    description: The file of the userAddress
                    type: string
                  lat:
                    description: The lat of the userAddress
                    type: number | null
                  lon:
                    description: The lon of the userAddress
                    type: number | null
                  name:
                    description: The name of the userAddress
                    type: string
                  reference:
                    description: The reference of the userAddress
                    type: string
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
          description: The userAddress created
      security:
      - BearerAuth: []
      summary: Creates a new userAddress
      tags:
      - UserAddress
  /api/userAddress/update:
