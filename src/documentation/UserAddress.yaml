components:
  schemas:
    UserAddress:
      type: object
      properties:
        id:
          type: number
          description: the auto-increment id of UserAddress
        name:
          type: string
          description: The name given by the user
        address:
          type: string
          description: It refers to the address returned by Google Maps.
        reference:
          type: string
          description: The user-written reference point.
        lat:
          type: string
          description: google maps latitude coordinate.
        lon:
          type: string
          description: google maps longitude coordinate.
        file:
          type: string
          description: image name.
      required:
        - name
        - lat
        - lon
      example:
        id: 3
        name: mi casa 2 update
        address: Guásimos, 5015, Táchira
        reference: mi referencia
        lat: 7.856909894631252
        lon: -72.2192597230659
        file: storage/1706891934498-13d8e4e0-4632-4061-85e5-ab9cbe4a1898.jpg
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            type: string
            description: the UserAddress id
  securitySchemes:
    BearerAuth: # puedes usar el nombre que quieras
      type: apiKey
      name: Authorization
      in: header
      x-auth-id: Bearer abcde12345
tags:
  - name: UserAddress
    description: User saved locations.
paths:
  /api/userAddress/show:
    get:
      security:
        - BearerAuth: []
      summary: Returns an UserAddress element
      tags:
        - UserAddress
      parameters:
        - $ref: '#/components/schemas/UserAddress/parameters/id'
      responses:
        '200':
          description: an UserAddress element
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAddress'
  /api/userAddress/all:
    get:
      security:
        - BearerAuth: []
      summary: Returns a list of UserAddress
      tags:
        - UserAddress
      parameters:
        - in: query
          name: pag
          schema:
            type: number
          description: the page number to fetch
        - in: query
          name: search
          schema:
            type: string
          description: the keyword to filter by name
      responses:
        '200':
          description: the list of UserAddress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAddress'
  /api/userAddress/store:
    post:
      security:
        - BearerAuth: []
      summary: Creates a new UserAddress
      tags:
        - UserAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                $ref: '#/components/schemas/UserAddress'
              required:
                $ref: '#/components/schemas/required'
              example:
                $ref: '#/components/schemas/UserAddress/example'
      responses:
        '201':
          description: the UserAddress created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
  /api/userAddress/update:
    post:
      security:
        - BearerAuth: []
      summary: Updates a UserAddress
      tags:
        - UserAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                $ref: '#/components/schemas/UserAddress'
              required:
                $ref: '#/components/schemas/required'
              example:
                $ref: '#/components/schemas/UserAddress/example'
      responses:
        '201':
          description: the UserAddress updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
  /api/userAddress/destroy:
    post:
      security:
        - BearerAuth: []
      summary: deletes an UserAddress element
      tags:
        - UserAddress
      parameters:
        - $ref: '#/components/schemas/UserAddress/parameters/id'
      responses:
        '200':
          description: an UserAddress element deleted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAddress'
