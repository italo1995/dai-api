                    description: The file of the userAddress
                    type: string
                  id:
                    description: The id of the userAddress
                    type: number
                  lat:
                    description: The lat of the userAddress
                    type: number | null
                  lon:
                    description: The lon of the userAddress
                    type: number | null
                  name:
                    description: The name of the userAddress
                    type: string
                  reference:
                    description: The reference of the userAddress
                    type: string
                  userId:
                    description: The userId of the userAddress
                    type: string
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
          description: The userAddress updated
      security:
      - BearerAuth: []
