components:
  schemas:
    Review:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Review id
            type: string
      properties:
        clientId:
          description: the clientId of the review
          type: string
        comment:
          description: the comment of the review
          type: string
        driverId:
          description: the driverId of the review
          type: string
        features:
          description: the features of the review
          type: boolean
        id:
          description: the id of the review
          type: number
        qualification:
          description: the qualification of the review
          type: number
        tripId:
          description: the tripId of the review
          type: number
        type:
          description: the type of the review
          type: ETypeReview
      required:
      - id
      - qualification
      - comment
      type: object
paths:
  /api/review/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of review
      tags:
      - Review
  /api/review/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/Review/parameters/id'
      responses:
        '201':
          description: The Review deleted
      security:
      - BearerAuth: []
      summary: Delete a review
      tags:
      - Review
  /api/review/show:
    get:
      parameters:
      - $ref: '#/components/schemas/Review/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Review'
                type: Array
          description: The list of review
      summary: Returns a review element
      tags:
      - Review
  /api/review/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  comment:
                    description: The comment of the review
                    type: string
                  features:
                    description: The features of the review
                    type: boolean
                  qualification:
                    description: The qualification of the review
                    type: number
                  type:
                    description: The type of the review
                    type: ETypeReview
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: The review created
      security:
      - BearerAuth: []
      summary: Creates a new review
      tags:
      - Review
  /api/review/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  clientId:
                    description: The clientId of the review
                    type: string
                  comment:
                    description: The comment of the review
                    type: string
                  driverId:
                    description: The driverId of the review
                    type: string
                  features:
                    description: The features of the review
                    type: boolean
                  id:
                    description: The id of the review
                    type: number
                  qualification:
                    description: The qualification of the review
                    type: number
                  tripId:
                    description: The tripId of the review
                    type: number
                  type:
                    description: The type of the review
                    type: ETypeReview
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: The review updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - Review
tags:
- Review
