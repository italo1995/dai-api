components:
  schemas:
    Suspension:
      type: object
      properties:
        id:
          type: number
          description: the auto-increment id of suspension
        driverId:
          type: string
          description: the driver id
        reason:
          type: string
          description: the reason for the Suspension
        timeFrame:
          type: enum
          description: the time options (indefinido = 1, hoy = 2, horas = 3, fecha = 4)
        init:
          type: date
          description: the date that began the Suspension
        end:
          type: date
          description: the date that wil end the Suspension
        isCanceled:
          type: boolean
          description: the suspension was canceled
        hours:
          type: number
          description: the quantity of hours that will last the suspension
      required:
        - driverId
        - reason
        - timeFrame
        - init
        - end
      example:
        id: 1
        driverId: 12354
        reason: exceso de velocidad
        timeFrame: 2
        init: 2024-03-29T22:10:42.000Z
        end: 2024-03-30T22:10:42.000Z
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            type: string
            description: the Suspension id
tags:
  - name: Suspension
    description: Suspension endpoint
paths:
  /api/suspension/show:
    get:
      summary: Returns a suspension element
      tags:
        - Suspension
      parameters:
        - $ref: '#/components/schemas/Suspension/parameters/id'
      responses:
        '200':
          description: the suspension element
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Suspension'
  /api/suspension/all:
    get:
      summary: Returns a list of suspensions
      tags:
        - Suspension
      parameters:
        - in: query
          name: pag
          schema:
            type: number
          description: the page number to fetch
        - in: query
          name: search
          schema:
            type: string
          description: the keyword to filter by name
      responses:
        '200':
          description: the list of Suspension
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Suspension'
  /api/suspension/store:
    post:
      summary: Creates a new suspension
      tags:
        - Suspension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                driverId:
                  type: string
                  description: the driver id
                reason:
                  type: string
                  description: the reason for the Suspension
                timeFrame:
                  type: enum
                  description: the time options (indefinido = 1, hoy = 2, horas = 3, fecha = 4)
                init:
                  type: date
                  description: the date that began the Suspension
                end:
                  type: date
                  description: the date that wil end the Suspension
                isCanceled:
                  type: boolean
                  description: the suspension was canceled
                hours:
                  type: number
                  description: the quantity of hours that will last the suspension
              required:
                - driverId
                - reason
                - timeFrame
                - init
                - end
              example:
                id: 1
                driverId: 12354
                reason: exceso de velocidad
                timeFrame: 2
                init: 2024-03-29T22:10:42.000Z
                end: 2024-03-30T22:10:42.000Z
      responses:
        '201':
          description: the Suspension created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suspension'
  /api/suspension/update:
    post:
      summary: Updates a Suspension
      tags:
        - Suspension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
                  description: the auto-increment id of suspension
                driverId:
                  type: string
                  description: the driver id
                reason:
                  type: string
                  description: the reason for the Suspension
                timeFrame:
                  type: enum
                  description: the time options (indefinido = 1, hoy = 2, horas = 3, fecha = 4)
                init:
                  type: date
                  description: the date that began the Suspension
                end:
                  type: date
                  description: the date that wil end the Suspension
                isCanceled:
                  type: boolean
                  description: the suspension was canceled
                hours:
                  type: number
                  description: the quantity of hours that will last the suspension
              required:
                - driverId
                - reason
                - timeFrame
                - init
                - end
              example:
                id: 1
                driverId: 12354
                reason: exceso de velocidad
                timeFrame: 2
                init: 2024-03-29T22:10:42.000Z
                end: 2024-03-30T22:10:42.000Z
      responses:
        '201':
          description: the suspension updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suspension'
  /api/suspension/cancelsuspended:
    post:
      summary: cancel a suspension
      tags:
        - suspension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
                  description: the auto-increment id of suspension
                driverId:
                  type: string
                  description: the driver id
                reason:
                  type: string
                  description: the reason for the Suspension
                timeFrame:
                  type: enum
                  description: the time options (indefinido = 1, hoy = 2, horas = 3, fecha = 4)
                init:
                  type: date
                  description: the date that began the Suspension
                end:
                  type: date
                  description: the date that wil end the Suspension
                isCanceled:
                  type: boolean
                  description: the suspension was canceled
                hours:
                  type: number
                  description: the quantity of hours that will last the suspension
              required:
                - driverId
                - reason
                - timeFrame
                - init
                - end
              example:
                id: 1
                driverId: 12354
                reason: se cancela la suspension
                init: 2024-03-29T22:10:42.000Z
                end: 2024-03-29T22:10:42.000Z
                isCanceled: true
      responses:
        '201':
          description: the suspension canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suspension'
