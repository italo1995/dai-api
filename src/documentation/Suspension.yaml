components:
  schemas:
    Suspension:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Suspension id
            type: string
      properties:
        adminId:
          description: the adminId of the suspension
          type: string
        driverId:
          description: the driverId of the suspension
          type: string
        end:
          description: the end of the suspension
          type: Date
        hours:
          description: the hours of the suspension
          type: number
        id:
          description: the id of the suspension
          type: number
        init:
          description: the init of the suspension
          type: Date
        isCanceled:
          description: the isCanceled of the suspension
          type: boolean
        reason:
          description: the reason of the suspension
          type: string
        timeFrame:
          description: the timeFrame of the suspension
          type: ETypeTime
      required:
      - id
      - driverId
      - reason
      - timeFrame
      - init
      - end
      type: object
paths:
  /api/suspension/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of suspension
      tags:
      - Suspension
  /api/suspension/cancel:
    post:
      parameters:
      - $ref: '#/components/schemas/Suspension/parameters/id'
      responses:
        '200':
          description: Success
      security:
      - BearerAuth: []
      summary: Endpoint for cancel
      tags:
      - Suspension
  /api/suspension/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/Suspension/parameters/id'
      responses:
        '201':
          description: The Suspension deleted
      security:
      - BearerAuth: []
      summary: Delete a suspension
      tags:
      - Suspension
  /api/suspension/show:
    get:
      parameters:
      - $ref: '#/components/schemas/Suspension/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Suspension'
                type: Array
          description: The list of suspension
      summary: Returns a suspension element
      tags:
      - Suspension
  /api/suspension/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  end:
                    description: The end of the suspension
                    type: Date
                  hours:
                    description: The hours of the suspension
                    type: number
                  init:
                    description: The init of the suspension
                    type: Date
                  isCanceled:
                    description: The isCanceled of the suspension
                    type: boolean
                  reason:
                    description: The reason of the suspension
                    type: string
                  timeFrame:
                    description: The timeFrame of the suspension
                    type: ETypeTime
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suspension'
          description: The suspension created
      security:
      - BearerAuth: []
      summary: Creates a new suspension
      tags:
      - Suspension
  /api/suspension/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  adminId:
                    description: The adminId of the suspension
                    type: string
                  driverId:
                    description: The driverId of the suspension
                    type: string
                  end:
                    description: The end of the suspension
                    type: Date
                  hours:
                    description: The hours of the suspension
                    type: number
                  id:
                    description: The id of the suspension
                    type: number
                  init:
                    description: The init of the suspension
                    type: Date
                  isCanceled:
                    description: The isCanceled of the suspension
                    type: boolean
                  reason:
                    description: The reason of the suspension
                    type: string
                  timeFrame:
                    description: The timeFrame of the suspension
                    type: ETypeTime
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suspension'
          description: The suspension updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - Suspension
tags:
- Suspension
