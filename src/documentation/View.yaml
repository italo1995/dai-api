components:
  schemas:
    View:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the View id
            type: string
      properties:
        icon:
          description: the icon of the view
          type: string
        id:
          description: the id of the view
          type: number
        route:
          description: the route of the view
          type: string
        title:
          description: the title of the view
          type: string
        url:
          description: the url of the view
          type: string
      required: []
      type: object
paths:
  /api/view/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/View'
                type: Array
          description: The list of view
      summary: Returns a list of view
      tags:
      - View
  /api/view/createMany:
    post:
      parameters:
      - $ref: '#/components/schemas/View/parameters/id'
      responses:
        '200':
          description: Success
      security:
      - BearerAuth: []
      summary: Endpoint for createMany
      tags:
      - View
  /api/view/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/View/parameters/id'
      responses:
        '201':
          description: The View deleted
      security:
      - BearerAuth: []
      summary: Delete a view
      tags:
      - View
  /api/view/show:
    get:
      parameters:
      - $ref: '#/components/schemas/View/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/View'
                type: Array
          description: The element of view
      summary: Returns a view element
      tags:
      - View
  /api/view/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  icon:
                    description: The icon of the view
                    type: string
                  route:
                    description: The route of the view
                    type: string
                  title:
                    description: The title of the view
                    type: string
                  url:
                    description: The url of the view
                    type: string
                required: []
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
          description: The view created
      security:
      - BearerAuth: []
      summary: Creates a new view
      tags:
      - View
  /api/view/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  icon:
                    description: The icon of the view
                    type: string
                  id:
                    description: The id of the view
                    type: number
                  route:
                    description: The route of the view
                    type: string
                  title:
                    description: The title of the view
                    type: string
                  url:
                    description: The url of the view
                    type: string
                required: []
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
          description: The view updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - View
tags:
- View
