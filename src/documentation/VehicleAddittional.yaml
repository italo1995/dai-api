components:
 schemas:
   VehicleAddittional:
     type: object
     properties:
       id:
         type: number
         description: the auto-increment id of VehicleAddittional
       name:
         type: string
         description: the name of the VehicleAddittional
       icon:
         type: string
         description: name icon
       isMoto:
         type: boolean
         description: refers to when it is a motorcycle accessory
       isCar:
         type: boolean
         description: refers to when it is a car add-on
       isClient:
         type: boolean
         description: refers to an additional item that the customer sees when requesting a trip
       isRegister:
         type: boolean
         description: refers to an additional item that the driver sees when registering
     required:
       - name
     example:
       id: 1
       name: A/C
     parameters:
      id:
       in: query
       name: id
       required: true
       schema:
        type: string
        description: the addittional services in the vehicle
tags:
  - name: VehicleAddittional
    description: VehicleAddittional endpoint
paths:
  /api/vehicleAddittional/show:
    get:
      summary: Returns a VehicleAddittional element
      tags:
        - VehicleAddittional
      parameters:
        - $ref: '#/components/schemas/VehicleAddittional/parameters/id'
      responses:
        '200':
          description: the VehicleAddittional element
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleAddittional'
  /api/vehicleAddittional/all:
    get:
      summary: Returns a list of VehicleAddittional
      tags:
        - VehicleAddittional
      parameters:
        - in: query
          name: pag
          schema:
            type: number
          description: the page number to fetch
        - in: query
          name: search
          schema:
            type: string
          description: the keyword to filter by name
      responses:
        '200':
          description: the list of additional services in the vehicle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleAddittional'
  /api/vehicleAddittional/store:
    post:
      summary: Creates a new VehicleAddittional
      tags:
        - VehicleAddittional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: the name of the addittional services in the vehicle
                icon:
                  type: string
                  description: name icon
                isMoto:
                  type: boolean
                  description: refers to when it is a motorcycle accessory
                isCar:
                  type: boolean
                  description: refers to when it is a car add-on
                isClient:
                  type: boolean
                  description: refers to an additional item that the customer sees when requesting a trip
                isRegister:
                  type: boolean
                  description: refers to an additional item that the driver sees when registering
              required:
               -name
              example:
                name: A/C
                icon: 'temp/icono.png'
                isMoto: true
                isCar: false
                isClient: true
                isRegister: false
      responses:
        '201':
          description: the VehicleAddittional created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAddittional'
  /api/vehicleAddittional/update:
    post:
      summary: Updates a VehicleAddittional
      tags:
        - VehicleAddittional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: the name of the addittional services in the vehicle
                icon:
                  type: string
                  description: name icon
                isMoto:
                  type: boolean
                  description: refers to when it is a motorcycle accessory
                isCar:
                  type: boolean
                  description: refers to when it is a car add-on
                isClient:
                  type: boolean
                  description: refers to an additional item that the customer sees when requesting a trip
                isRegister:
                  type: boolean
                  description: refers to an additional item that the driver sees when registering
              required:
               -id
               -name
              example:
                id: number
                name: A/C
                icon: 'storage/icono.png'
                isMoto: true
                isCar: false
                isClient: true
                isRegister: false
      responses:
        '201':
          description: the VehicleAddittional updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAddittional'
