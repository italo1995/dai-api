components:
  schemas:
    VehicleAdditional:
      type: object
      properties:
        id:
          type: number
          description: the auto-increment id of VehicleAdditional
        name:
          type: string
          description: the name of the VehicleAdditional
        icon:
          type: string
          description: name icon
        isMoto:
          type: boolean
          description: refers to when it is a motorcycle accessory
        isCar:
          type: boolean
          description: refers to when it is a car add-on
        isClient:
          type: boolean
          description: refers to an additional item that the customer sees when requesting a trip
        isRegister:
          type: boolean
          description: refers to an additional item that the driver sees when registering
      required:
        - name
      example:
        id: 1
        name: A/C
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            type: string
            description: the addittional services in the vehicle
tags:
  - name: VehicleAdditional
    description: VehicleAdditional endpoint
paths:
  /api/vehicleAdditional/show:
    get:
      summary: Returns a VehicleAdditional element
      tags:
        - VehicleAdditional
      parameters:
        - $ref: '#/components/schemas/VehicleAdditional/parameters/id'
      responses:
        '200':
          description: the VehicleAdditional element
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleAdditional'
  /api/vehicleAdditional/all:
    get:
      summary: Returns a list of VehicleAdditional
      tags:
        - VehicleAdditional
      parameters:
        - in: query
          name: pag
          schema:
            type: number
          description: the page number to fetch
        - in: query
          name: search
          schema:
            type: string
          description: the keyword to filter by name
      responses:
        '200':
          description: the list of additional services in the vehicle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleAdditional'
  /api/vehicleAdditional/store:
    post:
      summary: Creates a new VehicleAdditional
      tags:
        - VehicleAdditional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: the name of the addittional services in the vehicle
                icon:
                  type: string
                  description: name icon
                isMoto:
                  type: boolean
                  description: refers to when it is a motorcycle accessory
                isCar:
                  type: boolean
                  description: refers to when it is a car add-on
                isClient:
                  type: boolean
                  description: refers to an additional item that the customer sees when requesting a trip
                isRegister:
                  type: boolean
                  description: refers to an additional item that the driver sees when registering
              required: -name
              example:
                name: A/C
                icon: 'temp/icono.png'
                isMoto: true
                isCar: false
                isClient: true
                isRegister: false
      responses:
        '201':
          description: the VehicleAdditional created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAdditional'
  /api/vehicleAdditional/update:
    post:
      summary: Updates a VehicleAdditional
      tags:
        - VehicleAdditional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: the name of the addittional services in the vehicle
                icon:
                  type: string
                  description: name icon
                isMoto:
                  type: boolean
                  description: refers to when it is a motorcycle accessory
                isCar:
                  type: boolean
                  description: refers to when it is a car add-on
                isClient:
                  type: boolean
                  description: refers to an additional item that the customer sees when requesting a trip
                isRegister:
                  type: boolean
                  description: refers to an additional item that the driver sees when registering
              required: -id
                -name
              example:
                id: number
                name: A/C
                icon: 'storage/icono.png'
                isMoto: true
                isCar: false
                isClient: true
                isRegister: false
      responses:
        '201':
          description: the VehicleAdditional updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAdditional'
