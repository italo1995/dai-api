components:
  schemas:
    TripPayment:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the TripPayment id
            type: string
      properties:
        amount:
          description: the amount of the tripPayment
          type: number
        currencyId:
          description: the currencyId of the tripPayment
          type: number
        id:
          description: the id of the tripPayment
          type: number
        isAprobed:
          description: the isAprobed of the tripPayment
          type: boolean
        paymentMethodId:
          description: the paymentMethodId of the tripPayment
          type: number
        tripId:
          description: the tripId of the tripPayment
          type: number
        type:
          description: the type of the tripPayment
          type: ETypeReview
      required:
      - id
      - tripId
      - type
      - amount
      type: object
paths:
  /api/tripPayment/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TripPayment'
                type: Array
          description: The list of tripPayment
      summary: Returns a list of tripPayment
      tags:
      - TripPayment
  /api/tripPayment/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/TripPayment/parameters/id'
      responses:
        '201':
          description: The TripPayment deleted
      security:
      - BearerAuth: []
      summary: Delete a tripPayment
      tags:
      - TripPayment
  /api/tripPayment/show:
    get:
      parameters:
      - $ref: '#/components/schemas/TripPayment/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TripPayment'
                type: Array
          description: The element of tripPayment
      summary: Returns a tripPayment element
      tags:
      - TripPayment
  /api/tripPayment/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  amount:
                    description: The amount of the tripPayment
                    type: number
                  isAprobed:
                    description: The isAprobed of the tripPayment
                    type: boolean
                  type:
                    description: The type of the tripPayment
                    type: ETypeReview
                required:
                - id
                - tripId
                - type
                - amount
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPayment'
          description: The tripPayment created
      security:
      - BearerAuth: []
      summary: Creates a new tripPayment
      tags:
      - TripPayment
  /api/tripPayment/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  amount:
                    description: The amount of the tripPayment
                    type: number
                  currencyId:
                    description: The currencyId of the tripPayment
                    type: number
                  id:
                    description: The id of the tripPayment
                    type: number
                  isAprobed:
                    description: The isAprobed of the tripPayment
                    type: boolean
                  paymentMethodId:
                    description: The paymentMethodId of the tripPayment
                    type: number
                  tripId:
                    description: The tripId of the tripPayment
                    type: number
                  type:
                    description: The type of the tripPayment
                    type: ETypeReview
                required:
                - id
                - tripId
                - type
                - amount
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPayment'
          description: The tripPayment updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - TripPayment
tags:
- TripPayment
