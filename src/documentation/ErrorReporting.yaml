components:
  schemas:
    ErrorReporting:
      properties:
        id:
          description: the id of the error report
          type: string
        type:
          description: the event or HTTP path that originated the error (e.g. 'changeState', 'coords', or an HTTP path)
          type: string
        data:
          description: JSON string with the request/event that triggered the error (url, headers, body, userId)
          type: string
        error:
          description: JSON string with the caught error (message, stack)
          type: string
        createdAt:
          type: string
paths:
  /api/errorReporting/all:
    get:
      parameters:
        - description: The page number to fetch
          in: query
          name: pag
          schema:
            type: number
        - description: Items per page
          in: query
          name: limit
          schema:
            type: number
        - description: Search text, matched against 'type' by default (set typeSearch to change)
          in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ErrorReporting'
                type: Array
          description: Paginated list of captured errors (admin/operator only)
      summary: Returns a paginated list of captured server errors (admin panel, hidden route - see payaWeb menu-routing.module.ts 'errores')
      tags:
        - ErrorReporting
  /api/errorReporting/app:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                message:
                  type: string
                  description: required - error message
                stack:
                  type: string
                screen:
                  type: string
                  description: screen/route where it happened
                platform:
                  type: string
                  description: android | ios
                appVersion:
                  type: string
                device:
                  type: string
                extra:
                  type: object
                  description: any additional context (stored as JSON, truncated)
              required:
                - message
      responses:
        '200':
          description: Error stored with type 'app' (userId taken from the token, if any)
        '400':
          description: message is missing
        '429':
          description: more than 30 reports per minute from the same user/IP
      summary: Stores an error reported by the mobile app (public - Authorization header optional)
      tags:
        - ErrorReporting
