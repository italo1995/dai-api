components:
  schemas:
    StoreProduct:
      type: object
      properties:
        id:
          type: number
        storeId:
          type: number
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
        currencyId:
          type: number
          nullable: true
        currency:
          type: object
          nullable: true
          description: 'Moneda en la que esta expresado price/promoPrice/finalPrice, ya resuelta (mismo patron que currency en cart/show). Incluido en /show y /all - no requiere resolver currencyId aparte contra currency/all.'
          properties:
            id:
              type: number
            name:
              type: string
            symbol:
              type: string
        image:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        isAvailable:
          type: boolean
        isInventoryable:
          type: boolean
        stockQuantity:
          type: number
          nullable: true
        volume:
          type: number
          nullable: true
          description: 'Volumen del producto, unidad libre que define cada tienda/admin (ej: un tequeno 5, una torta 30 porque va con caja). Hoy es solo informativo - el tope maximo por vehiculo (moto vs carro) todavia no esta implementado'
        timesSold:
          type: number
          description: 'Ventas acumuladas del producto (estadistica siempre creciente, aparte del inventario). Se incrementa al crear un pedido de Marketplace y se revierte si el comercio lo cancela.'
        modifierGroups:
          type: array
          items:
            $ref: '#/components/schemas/StoreProductModifierGroup'
          description: 'Incluido en /show y /all (con sus opciones) - ver StoreProductModifierGroup.yaml. No requiere un llamado aparte'
        images:
          type: array
          items:
            type: object
            properties:
              id:
                type: number
              image:
                type: string
              order:
                type: number
          description: 'Galeria de fotos adicionales (aparte de "image", que sigue siendo la portada usada en listados). Al crear/editar se manda como array de strings (paths) en el mismo campo "images" - reemplaza toda la galeria, no hay CRUD por foto individual. El orden del array define el orden en que se muestran'
paths:
  /api/storeProduct/all:
    get:
      summary: Catalogo publico de una tienda (uso app)
      description: 'Solo productos con isAvailable=true de tiendas aprobadas. Siempre pagina (a diferencia de allAdmin, que solo pagina si se manda pag)'
      tags:
        - StoreProduct
      parameters:
        - in: query
          name: storeId
          required: true
          schema:
            type: number
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Busca por nombre de producto (contiene, sin importar mayusculas)
        - in: query
          name: departmentId
          required: false
          schema:
            type: number
          description: Un solo id de StoreDepartment
        - in: query
          name: categoryId
          required: false
          schema:
            type: string
          description: 'Uno o varios ids de StoreCategory separados por coma (ej: 1,3). Trae productos que tengan al menos una'
        - in: query
          name: limit
          required: false
          schema:
            type: number
            default: 10
        - in: query
          name: page
          required: false
          schema:
            type: number
            default: 1
      responses:
        '200':
          description: 'Success - respuesta paginada: total, totalPage, actualPage, data (array de StoreProduct)'
  /api/storeProduct/show:
    get:
      summary: Trae un producto por id
      tags:
        - StoreProduct
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Success
  /api/storeProduct/allAdmin:
    get:
      summary: Lista de productos para el panel
      description: Si el usuario autenticado tiene rol 'store' (rolId 4), devuelve solo productos de sus propias tiendas. Admin/operator ve todos, filtrable por ?storeId=X
      tags:
        - StoreProduct
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success
  /api/storeProduct/store:
    post:
      summary: Crea un producto
      description: El dueño solo puede crear productos en una tienda propia
      tags:
        - StoreProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProduct'
      responses:
        '200':
          description: Success
        '403':
          description: Acceso denegado
  /api/storeProduct/update:
    post:
      summary: Actualiza un producto
      tags:
        - StoreProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProduct'
      responses:
        '200':
          description: Success
        '403':
          description: Acceso denegado
  /api/storeProduct/delete:
    post:
      summary: Elimina (soft delete) un producto
      tags:
        - StoreProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
      responses:
        '200':
          description: Success
        '403':
          description: Acceso denegado
tags:
  - name: StoreProduct
    description: Catalogo de productos de tiendas del Marketplace
