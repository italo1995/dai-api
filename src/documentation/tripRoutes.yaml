components:
 schemas:
   TripRoutes:
     type: object
     properties:
       id:
         type: string
         description: the auto-increment id of the trip routes
       tripId:
         type: number
         description: The Id of the trip
       isInit:
         type: boolean
         description: shows if the trip is already began
       isEnd:
         type: boolean
         description: shows if the trip is already ended
       orden:
         type: number
         description: the order of the trip
       address:
         type: string
         description: the address of the user
       reference:
         type: string
         description: the reference of the user's address
       referencePointImage:
         type: string
         description: the file with the image of the reference point
       lat:
         type: number
         description: latitud of the user
       lon:
         type: number
         description: longitud of the user
       userAddressId:
         type: number
         description: the id of the user's address
     required:
       - tripId
       - isInit
       - isEnd
       - address
       - reference
       - referencePointImagen
       - lat
       - lon 
       - userAddressId
     example:
       id: 3
       tripId: 55
       isInit: true
       isEnd: true
       address: car 7 #3-45 Barrio Obrero
       reference: frente a supermercado
       referencePointImage: './store/image/reference1.png'
       lat: 7.46098
       lon: -72.1330
       userAddressId: 72
     parameters:
      id:
       in: query
       name: id
       required: true
       schema:
        type: string
        description: payment method id
 securitySchemes:
  BearerAuth: # puedes usar el nombre que quieras
   type: apiKey
   name: Authorization
   in: header
   x-auth-id: Bearer abcde12345
tags:
  - name: TripRoutes
    description: trip Routes
paths:
  /api/tripRoutes/show:
    get:
      security:
      - BearerAuth: []
      summary: Returns a element TripRoute
      tags:
        - TripRoutes
      parameters:
        - $ref: '#/components/schemas/tripRoutes/parameters/id'
      responses:
        '200':
          description: a TripRoute element
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/tripRoutes'
  /api/tripRoute/all:
    get:
      security:
      - BearerAuth: []
      summary: Returns a list of trip routes
      tags:
        - TripRoutes
      parameters:
        - in: query
          name: pag
          schema:
            type: number
          description: the page number to fetch
        - in: query
          name: search
          schema:
            type: string
          description: the keyword to filter by name
      responses:
        '200':
          description: the list of payment method
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/tripRoutes'
  /api/paymentMwethod/store:
    post:
      security:
      - BearerAuth: []
      summary: Creates a new trip route
      tags:
        - TripRoutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                $ref: '#/components/schemas/tripRoute'
              required:
                $ref: '#/components/schemas/required'
              example:
                $ref: '#/components/schemas/tripRoute/example'
      responses:
        '201':
          description: the TripRoute created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tripRoute'
  /api/ptripRoute/update:
    post:
      security:
      - BearerAuth: []
      summary: Update a new TripRoute
      tags:
        - TripRoutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                $ref: '#/components/schemas/tripRoute'
              required:
                $ref: '#/components/schemas/required'
              example:
                $ref: '#/components/schemas/tripRoute/example'
      responses:
        '201':
          description: the TripRoute created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tripRoute'
