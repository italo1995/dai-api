components:
 schemas:
   New:
     type: object
     properties:
       id:
         type: number
         description: the auto-increment id of new
       name:
         type: string
         description: the name of the new
       image:
         type: string
         description: the name of the file of the image for the new
       description: 
         type: string
         description: the description of the new
     required:
       - name
       - image
       - description
     example:
       id: 1
       name: Noticia
       image: storage/filenew.png
       description: new information about the app
     parameters:
      id:
       in: query
       name: id
       required: true
       schema:
        type: string
        description: the New id
tags:
  - name: New
    description: New endpoint
paths:
  /api/new/show:
    get:
      summary: Returns a list of New
      tags:
        - New
      parameters:
        - $ref: '#/components/schemas/New/parameters/id'
      responses:
        '200':
          description: the list of the News
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/New'
  /api/New/all:
    get:
      summary: Returns a list of New
      tags:
        - New
      parameters:
        - in: query
          name: pag
          schema:
            type: number
          description: the page number to fetch
        - in: query
          name: search
          schema:
            type: string
          description: the keyword to filter by name
      responses:
        '200':
          description: the list of New
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/New'
  /api/New/store:
    post:
      summary: Creates a new New
      tags:
        - New
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: the name of the New
                image:
                  type: string
                  description: the file name of the image for the New
                orden:
                  type: number
                  description: the order of the New
                link:
                  type: string
                  description: the link of the New
                state:
                  type: boolean
                  description: the state of the New
              required:
                - name
                - image
                - link
                - state
              example:
                name: New
                image: store/filenews.png
                description: new information about the app
                state: true
      responses:
        '201':
          description: the New created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/New'
  /api/New/update:
    post:
      summary: Update a new
      tags:
        - New
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: the name of the New
                image:
                  type: string
                  description: the name of the image file of the new
                description:
                  type: string
                  description: the description of the new
                state:
                  type: boolean
                  description: the state of the new
              required:
                - id
              example:
                id: 1
                name: new
                image: store/filenew.png
                link: new information obout the app
                state: true
      responses:
        '201':
          description: the new created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/New'
