paths:
  /api/admin/passwordResetLink:
    post:
      summary: Generates a single-use password reset link for a store account (rolId 4)
      description: >
        Admin/operator only. Meant to be used after verifying the store by phone call: the admin
        sends the link to the store and the store sets its own new password (the admin never sees
        or sets it). Valid for 24 h, single use. Generating a new link invalidates the previous
        unused ones for that user. The token is stored only as a sha256 hash.
        The url is built from the WEB_URL env var, or from the request Origin header if WEB_URL is not set.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                userId:
                  type: string
                  description: store owner user id (one of userId / storeId is required)
                storeId:
                  type: number
                  description: store id - the link is generated for its owner
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  url:
                    type: string
                    description: full link to send to the store (null if neither WEB_URL nor Origin are available)
                  path:
                    type: string
                    description: path of the link inside payaWeb (/recuperar/<token>)
                  expiresAt:
                    type: string
                  user:
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
          description: Link generated
        '400':
          description: Missing userId/storeId, or the user is not a store account
        '403':
          description: Not admin/operator
        '404':
          description: User/store not found
      tags:
        - PasswordReset
  /api/auth/passwordReset/validateLink:
    post:
      summary: Checks whether a reset link token is still valid (public)
      description: Used by payaWeb /recuperar/:token before showing the new password form.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                token:
                  type: string
              required:
                - token
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  valid:
                    type: boolean
                  email:
                    type: string
                    description: email of the store account (also helps a store that forgot its username)
                  expiresAt:
                    type: string
          description: Token is valid
        '400':
          description: Token does not exist, was already used or expired
        '429':
          description: Too many requests from this IP
      tags:
        - PasswordReset
  /api/auth/passwordReset/link:
    post:
      summary: Sets a new password using a reset link token (public)
      requestBody:
        content:
          application/json:
            schema:
              properties:
                token:
                  type: string
                password:
                  type: string
                  description: new password, at least 8 characters
              required:
                - token
                - password
      responses:
        '200':
          description: Password updated; the token is marked as used and any other pending token of the user is invalidated
        '400':
          description: Invalid/used/expired token, or password too short
        '429':
          description: Too many requests from this IP
      tags:
        - PasswordReset
  /api/auth/passwordReset/requestCode:
    post:
      summary: Sends a 6-digit reset code by SMS to the store's registered phone (public)
      description: >
        Always answers the same generic message whether the email exists, is not a store, or has
        no phone, so it does not reveal which accounts exist. The code expires in 10 minutes and
        allows up to 5 attempts. If a code was sent less than 60 s ago, no new SMS is sent.
        Limited to 10 requests per IP and 3 per email every 15 minutes.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
              required:
                - email
      responses:
        '200':
          description: Generic message (code sent if applicable)
        '400':
          description: Missing email
        '429':
          description: Too many requests
      tags:
        - PasswordReset
  /api/auth/passwordReset/code:
    post:
      summary: Sets a new password using the SMS code (public)
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                code:
                  type: string
                  description: 6-digit code received by SMS
                password:
                  type: string
                  description: new password, at least 8 characters
              required:
                - email
                - code
                - password
      responses:
        '200':
          description: Password updated
        '400':
          description: Invalid/expired code (each failure counts as an attempt; after 5 the code is invalidated), or password too short
        '429':
          description: Too many requests from this IP
      tags:
        - PasswordReset
