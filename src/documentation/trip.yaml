  /api/trip/showTripActive:
    get:
      parameters:
        - $ref: '#/components/schemas/Trip/parameters/id'
      responses:
        '200':
          description: Success
      security:
        - BearerAuth: []
      summary: Endpoint for showTripActive
      tags:
        - Trip
  /api/trip/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  description: The date of the trip
                  type: string
                instructionsToDriver:
                  description: The instructionsToDriver of the trip
                  type: string
                isNear:
                  description: The isNear of the trip
                  type: boolean
                isPanic:
                  description: The isPanic of the trip
                  type: boolean
                isPayment:
                  description: The isPayment of the trip
                  type: number
                percentage:
                  description: The percentage of the trip
                  type: number
                price:
                  description: The price of the trip
                  type: number
                serviceDistance:
                  description: The serviceDistance of the trip
                  type: string
                status:
                  description: The status of the trip
                  type: EStatusVerify
                typeService:
                  description: The typeService of the trip
                  type: ETypeService
                visibility:
                  description: The visibility of the trip
                  type: number
                  nullable: true
              required:
                - typeService
                - isPayment
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: The trip created
      security:
        - BearerAuth: []
      summary: Creates a new trip
      tags:
        - Trip
  /api/trip/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
