                cityId:
                  description: The cityId of the trip
                  type: number
                  nullable: true
                countryId:
                  description: The countryId of the trip
                  type: number
                  nullable: true
                currencyId:
                  description: The currencyId of the trip
                  type: number
                date:
                  description: The date of the trip
                  type: string
                driverId:
                  description: The driverId of the trip
                  type: string
                id:
                  description: The id of the trip
                  type: number
                instructionsToDriver:
                  description: The instructionsToDriver of the trip
                  type: string
                isNear:
                  description: The isNear of the trip
                  type: boolean
                isPanic:
                  description: The isPanic of the trip
                  type: boolean
                isPayment:
                  description: The isPayment of the trip
                  type: number
                percentage:
                  description: The percentage of the trip
                  type: number
                price:
                  description: The price of the trip
                  type: number
                regionId:
                  description: The regionId of the trip
                  type: number
                  nullable: true
                serviceDistance:
                  description: The serviceDistance of the trip
                  type: string
                status:
                  description: The status of the trip
                  type: EStatusVerify
                typeService:
                  description: The typeService of the trip
                  type: ETypeService
                userId:
                  description: The userId of the trip
                  type: string
                visibility:
                  description: The visibility of the trip
                  type: number
                  nullable: true
              required:
                - id
                - typeService
                - userId
                - isPayment
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: The trip updated
      security:
        - BearerAuth: []
      summary: Update a Trip
      tags:
        - Trip
tags:
  - Trip
