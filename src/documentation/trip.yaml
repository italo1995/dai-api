components:
  schemas:
    Trip:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Trip id
            type: string
      properties:
        cityId:
          description: the cityId of the trip
          type: number
          nullable: true
        countryId:
          description: the countryId of the trip
          type: number
          nullable: true
        currencyId:
          description: the currencyId of the trip
          type: number
        date:
          description: the date of the trip
          type: string
        driverId:
          description: the driverId of the trip
          type: string
        id:
          description: the id of the trip
          type: number
        instructionsToDriver:
          description: the instructionsToDriver of the trip
          type: string
        isNear:
          description: the isNear of the trip
          type: boolean
        isPanic:
          description: the isPanic of the trip
          type: boolean
        isPayment:
          description: the isPayment of the trip
          type: number
        percentage:
          description: the percentage of the trip
          type: number
        price:
          description: the price of the trip
          type: number
        regionId:
          description: the regionId of the trip
          type: number
          nullable: true
        serviceDistance:
          description: the serviceDistance of the trip
          type: string
        status:
          description: the status of the trip
          type: EStatusVerify
        typeService:
          description: the typeService of the trip
          type: ETypeService
        userId:
          description: the userId of the trip
          type: string
        visibility:
          description: the visibility of the trip
          type: number
          nullable: true
      required:
        - id
        - typeService
        - userId
        - isPayment
      type: object
paths:
  /api/trip/all:
    get:
      parameters:
        - description: The page number to fetch
          in: query
          name: pag
          schema:
            type: number
        - description: The keyword to filter by name
          in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Trip'
                type: Array
          description: The list of trip
      summary: Returns a list of trip
      tags:
        - Trip
  /api/trip/allAdmin:
    get:
      parameters:
        - $ref: '#/components/schemas/Trip/parameters/id'
      responses:
        '200':
          description: Success
      security:
        - BearerAuth: []
      summary: Endpoint for allAdmin
      tags:
        - Trip
  /api/trip/cancelTrip:
    post:
      parameters:
        - $ref: '#/components/schemas/Trip/parameters/id'
      responses:
        '200':
          description: Success
      summary: Endpoint for cancelTrip
      tags:
        - Trip
  /api/trip/hidde:
    post:
      parameters:
        - $ref: '#/components/schemas/Trip/parameters/id'
      responses:
        '200':
          description: Success
      security:
        - BearerAuth: []
      summary: Endpoint for hidde
      tags:
        - Trip
  /api/trip/show:
    get:
      parameters:
        - $ref: '#/components/schemas/Trip/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Trip'
                type: Array
          description: The element of trip
      summary: Returns a trip element
      tags:
        - Trip
  /api/trip/showActive:
    get:
      parameters:
        - $ref: '#/components/schemas/Trip/parameters/id'
      responses:
        '200':
          description: Success
      security:
        - BearerAuth: []
      summary: Endpoint for showActive
      tags:
        - Trip
  /api/trip/showPanic:
    get:
      parameters:
        - $ref: '#/components/schemas/Trip/parameters/id'
      responses:
        '200':
          description: Success
      summary: Endpoint for showPanic
