components:
  schemas:
    Trip:
      type: object
      properties:
        id:
          type: number
          description: the auto-increment id of Trip
        typeService:
          type: string
          description: the type of trip
        userId:
          type: string
          description: the id of the user
        driverId:
          type: string
          description: the Id of the driver
        date:
          type: date
          description: the date of the trip
        status:
          type: string
          description: the status of the trip
        price:
          type: number
          description: the pprice of the trip
        currencyId:
          type: number
          description: the currency of the payment
        isPayment:
          type: number
          description: the amount of the payment
      required:
        - typeService
        - userId
        - isPayment
      example:
        id: 1
        typeService: MOTO | CAR | DELIVERY | TRAVEL
        date: date
        price: 10
        currencyId: 1
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            type: string
            description: the trip id
  securitySchemes:
    BearerAuth: # puedes usar el nombre que quieras
      type: apiKey
      name: Authorization
      in: header
      x-auth-id: Bearer abcde12345
tags:
  - name: Trip
    description: Trip endpoint
paths:
  /api/trip/show:
    get:
      security:
        - BearerAuth: []
      summary: Returns a trip element
      tags:
        - Trip
      parameters:
        - $ref: '#/components/schemas/Trip/parameters/id'
      responses:
        '200':
          description: the trip element
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
  /api/trip/all:
    get:
      security:
        - BearerAuth: []
      summary: Returns a list of trips
      tags:
        - Trip
      parameters:
        - in: query
          name: pag
          schema:
            type: number
          description: the page number to fetch
        - in: query
          name: search
          schema:
            type: string
          description: the keyword to filter by name
      responses:
        '200':
          description: the list of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
  /api/trip/store:
    post:
      security:
        - BearerAuth: []
      summary: Creates a new trip
      tags:
        - Trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: automatic
                driverId:
                  type: string
                  description: the Id of the driver
                date:
                  type: date
                  description: the date of the trip
                status:
                  type: string
                  description: the status of the trip
                price:
                  type: number
                  description: the pprice of the trip
                currencyId:
                  type: number
                  description: the currency of the payment
                isPayment:
                  type: number
                  description: the amount of the payment
              required:
                - typeService
                - isPayment
              example:
                typeService: 'MOTO'
                date: date
                price: 10
                fee: { currencyId: 1, price: 10 }
                delivery: { toSearch: 'una caja' }
                travel:
                  {
                    dateToInitTravel: '12/02/204',
                    howMuchPeopleToTravel: 7,
                    packageToCarry: 'una caja',
                    approxWeightOfPackage: 100,
                  }
                initRoute:
                  {
                    isInit: true,
                    address: 'san cristobal, tachira',
                    reference: 'por la plaza',
                    referencePointImage: 'temp/imagen.png',
                    lat: '7.5923456',
                    lon: '-72.4729856',
                    userAddressId: null,
                  }
                endRoute:
                  {
                    isEnd: true,
                    address: 'san cristobal, tachira',
                    reference: 'por la plaza',
                    referencePointImage: 'temp/imagen.png | null',
                    lat: '7.5923456',
                    lon: '-72.4729856',
                    userAddressId: null,
                  }
                paymentMethod:
                  { type: 'efectivo | stripe', amount: 10, currencyId: 1, paymentMethodId: 1 }
      responses:
        '201':
          description: the trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
  /api/trip/update:
    post:
      security:
        - BearerAuth: []
      summary: Updates a trip
      tags:
        - Trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                typeService:
                  type: string
                  description: the type of trip
                userId:
                  type: string
                  description: the id of the user
                driverId:
                  type: string
                  description: the Id of the driver
                date:
                  type: date
                  description: the date of the trip
                status:
                  type: string
                  description: the status of the trip
                price:
                  type: number
                  description: the pprice of the trip
                currencyId:
                  type: number
                  description: the currency of the payment
                isPayment:
                  type: number
                  description: the amount of the payment
              required:
                - id
              example:
                id: 1
                typeService: 'MOTO'
                date: date
                price: 10
                fee: { currencyId: 1, price: 10 }
                delivery: { toSearch: 'una caja' }
                travel:
                  {
                    dateToInitTravel: '12/02/204',
                    howMuchPeopleToTravel: 7,
                    packageToCarry: 'una caja',
                    approxWeightOfPackage: 100,
                  }
                initRoute:
                  {
                    isInit: true,
                    address: 'san cristobal, tachira',
                    reference: 'por la plaza',
                    referencePointImage: 'temp/imagen.png',
                    lat: '7.5923456',
                    lon: '-72.4729856',
                    userAddressId: null,
                  }
                endRoute:
                  {
                    isEnd: true,
                    address: 'san cristobal, tachira',
                    reference: 'por la plaza',
                    referencePointImage: 'temp/imagen.png | null',
                    lat: '7.5923456',
                    lon: '-72.4729856',
                    userAddressId: null,
                  }
                paymentMethod:
                  { type: 'efectivo | stripe', amount: 10, currencyId: 1, paymentMethodId: 1 }
      responses:
        '201':
          description: the trip updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
