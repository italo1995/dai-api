components:
  schemas:
    Recharge:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Recharge id
            type: string
      properties:
        adminId:
          description: the adminId of the recharge
          type: string
        amount:
          description: the amount of the recharge
          type: number
        bank:
          description: the bank of the recharge
          type: number
        bankId:
          description: the bankId of the recharge
          type: number
        capture:
          description: the capture of the recharge
          type: string
        code:
          description: the code of the recharge
          type: string
        countryId:
          description: the countryId of the recharge
          type: number | null
        currencyId:
          description: the currencyId of the recharge
          type: number
        id:
          description: the id of the recharge
          type: number
        reason:
          description: the reason of the recharge
          type: string
        reference:
          description: the reference of the recharge
          type: string
        status:
          description: the status of the recharge
          type: EStatusVerify
        type:
          description: the type of the recharge
          type: ETypeReview
        userId:
          description: the userId of the recharge
          type: string
      required: []
      type: object
paths:
  /api/recharge/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of recharge
      tags:
      - Recharge
  /api/recharge/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/Recharge/parameters/id'
      responses:
        '201':
          description: The Recharge deleted
      security:
      - BearerAuth: []
      summary: Delete a recharge
      tags:
      - Recharge
  /api/recharge/show:
    get:
      parameters:
      - $ref: '#/components/schemas/Recharge/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Recharge'
                type: Array
          description: The list of recharge
      summary: Returns a recharge element
      tags:
      - Recharge
  /api/recharge/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  amount:
                    description: The amount of the recharge
                    type: number
                  bank:
                    description: The bank of the recharge
                    type: number
                  capture:
                    description: The capture of the recharge
                    type: string
                  code:
                    description: The code of the recharge
                    type: string
                  reason:
                    description: The reason of the recharge
                    type: string
                  reference:
                    description: The reference of the recharge
                    type: string
                  status:
                    description: The status of the recharge
                    type: EStatusVerify
                  type:
                    description: The type of the recharge
                    type: ETypeReview
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recharge'
          description: The recharge created
      security:
      - BearerAuth: []
      summary: Creates a new recharge
      tags:
      - Recharge
  /api/recharge/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  adminId:
                    description: The adminId of the recharge
                    type: string
                  amount:
                    description: The amount of the recharge
                    type: number
                  bank:
                    description: The bank of the recharge
                    type: number
                  bankId:
                    description: The bankId of the recharge
                    type: number
                  capture:
                    description: The capture of the recharge
                    type: string
                  code:
                    description: The code of the recharge
                    type: string
                  countryId:
                    description: The countryId of the recharge
                    type: number | null
                  currencyId:
                    description: The currencyId of the recharge
                    type: number
                  id:
                    description: The id of the recharge
                    type: number
                  reason:
                    description: The reason of the recharge
                    type: string
                  reference:
                    description: The reference of the recharge
                    type: string
                  status:
                    description: The status of the recharge
                    type: EStatusVerify
                  type:
                    description: The type of the recharge
                    type: ETypeReview
                  userId:
                    description: The userId of the recharge
                    type: string
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recharge'
          description: The recharge updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - Recharge
  /api/recharge/verify:
    post:
      parameters:
      - $ref: '#/components/schemas/Recharge/parameters/id'
      responses:
        '200':
          description: Success
      security:
      - BearerAuth: []
      summary: Endpoint for verify
      tags:
      - Recharge
tags:
- Recharge
