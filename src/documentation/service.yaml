components:
  schemas:
    Service:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Service id
            type: string
      properties:
        description:
          description: the description of the service
          type: string
        id:
          description: the id of the service
          type: string
        image:
          description: the image of the service
          type: string
        name:
          description: the name of the service
          type: string
        state:
          description: the state of the service
          type: boolean
      required:
      - id
      - name
      - image
      - description
      type: object
paths:
  /api/service/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of service
      tags:
      - Service
  /api/service/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/Service/parameters/id'
      responses:
        '201':
          description: The Service deleted
      security:
      - BearerAuth: []
      summary: Delete a service
      tags:
      - Service
  /api/service/show:
    get:
      parameters:
      - $ref: '#/components/schemas/Service/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Service'
                type: Array
          description: The list of service
      summary: Returns a service element
      tags:
      - Service
  /api/service/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  description:
                    description: The description of the service
                    type: string
                  image:
                    description: The image of the service
                    type: string
                  name:
                    description: The name of the service
                    type: string
                  state:
                    description: The state of the service
                    type: boolean
                required:
                - name
                - icon
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - type
                - comment
                - status
                - driverId
                - reason
                - id
                - parentId
                - clientId
                - tripId
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: The service created
      security:
      - BearerAuth: []
      summary: Creates a new service
      tags:
      - Service
  /api/service/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  description:
                    description: The description of the service
                    type: string
                  id:
                    description: The id of the service
                    type: string
                  image:
                    description: The image of the service
                    type: string
                  name:
                    description: The name of the service
                    type: string
                  state:
                    description: The state of the service
                    type: boolean
                required:
                - name
                - icon
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - type
                - comment
                - status
                - driverId
                - reason
                - id
                - parentId
                - clientId
                - tripId
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: The service updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - Service
tags:
- Service
