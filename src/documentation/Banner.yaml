components:
  schemas:
    Banner:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Banner id
            type: string
      properties:
        id:
          description: the id of the banner
          type: number
        image:
          description: the image of the banner
          type: string
        link:
          description: the link of the banner
          type: string
        name:
          description: the name of the banner
          type: string
        orden:
          description: the orden of the banner
          type: number
        state:
          description: the state of the banner
          type: boolean
        isPriority:
          description: >-
            Si es true, el banner siempre se incluye en /api/banner/all (endpoint público).
            Si es false, entra al pool del que se eligen al azar los banners restantes hasta
            completar MAX_BANNERS (6).
          type: boolean
      required:
        - id
        - name
        - image
      type: object
    BannerPublic:
      type: object
      description: >-
        Forma pública que recibe la app (/api/banner/all). Hasta 6 banners activos: primero
        los isPriority=true, el resto elegido al azar en cada consulta.
      properties:
        id:
          type: number
        name:
          type: string
        image:
          type: string
          description: Ruta relativa de la imagen. URL completa = APIURL + /file/show/ + image
        orden:
          type: number
          nullable: true
        link:
          type: string
          nullable: true
paths:
  /api/banner/all:
    get:
      summary: 'Endpoint público para la app: hasta 6 banners activos, priorizados + aleatorios'
      description: >-
        Devuelve como máximo MAX_BANNERS (6) banners con state=true. Primero incluye todos
        los que tienen isPriority=true (ordenados por orden), y completa los cupos restantes
        eligiendo al azar entre los banners sin prioridad. El orden del resultado cambia en
        cada consulta.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  code: { type: number }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BannerPublic'
          description: The list of banner
      tags:
        - Banner
  /api/banner/allAdmin:
    get:
      summary: Lista completa de banners para el panel admin (activos e inactivos)
      security:
        - BearerAuth: []
      parameters:
        - description: The page number to fetch
          in: query
          name: pag
          schema:
            type: number
        - description: The keyword to filter by name
          in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Banner'
                type: Array
          description: The list of banner
      tags:
        - Banner
  /api/banner/delete:
    post:
      parameters:
        - $ref: '#/components/schemas/Banner/parameters/id'
      responses:
        '200':
          description: The Banner deleted
      security:
        - BearerAuth: []
      summary: Delete a banner
      tags:
        - Banner
  /api/banner/show:
    get:
      parameters:
        - $ref: '#/components/schemas/Banner/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Banner'
                type: Array
          description: The element of banner
      summary: Returns a banner element
      tags:
        - Banner
  /api/banner/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                image:
                  description: The image of the banner
                  type: string
                link:
                  description: The link of the banner
                  type: string
                name:
                  description: The name of the banner
                  type: string
                orden:
                  description: The orden of the banner
                  type: number
                state:
                  description: The state of the banner
                  type: boolean
                isPriority:
                  description: Si es true, el banner siempre se muestra en /api/banner/all
                  type: boolean
              required:
                - name
                - image
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Banner'
          description: The banner created
      security:
        - BearerAuth: []
      summary: Creates a new banner
      tags:
        - Banner
  /api/banner/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  description: The id of the banner
                  type: number
                image:
                  description: The image of the banner
                  type: string
                link:
                  description: The link of the banner
                  type: string
                name:
                  description: The name of the banner
                  type: string
                orden:
                  description: The orden of the banner
                  type: number
                state:
                  description: The state of the banner
                  type: boolean
                isPriority:
                  description: Si es true, el banner siempre se muestra en /api/banner/all
                  type: boolean
              required:
                - id
                - name
                - image
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Banner'
          description: The banner updated
      security:
        - BearerAuth: []
      summary: Update a Banner
      tags:
        - Banner
tags:
  - Banner
