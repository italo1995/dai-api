components:
  schemas:
    Banner:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Banner id
            type: string
      properties:
        id:
          description: the id of the banner
          type: number
        image:
          description: the image of the banner
          type: string
        link:
          description: the link of the banner
          type: string
        name:
          description: the name of the banner
          type: string
        orden:
          description: the orden of the banner
          type: number
        state:
          description: the state of the banner
          type: boolean
      required:
        - id
        - name
        - image
      type: object
paths:
  /api/banner/all:
    get:
      parameters:
        - description: The page number to fetch
          in: query
          name: pag
          schema:
            type: number
        - description: The keyword to filter by name
          in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Banner'
                type: Array
          description: The list of banner
      summary: Returns a list of banner
      tags:
        - Banner
  /api/banner/delete:
    post:
      parameters:
        - $ref: '#/components/schemas/Banner/parameters/id'
      responses:
        '200':
          description: The Banner deleted
      security:
        - BearerAuth: []
      summary: Delete a banner
      tags:
        - Banner
  /api/banner/show:
    get:
      parameters:
        - $ref: '#/components/schemas/Banner/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Banner'
                type: Array
          description: The element of banner
      summary: Returns a banner element
      tags:
        - Banner
  /api/banner/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                image:
                  description: The image of the banner
                  type: string
                link:
                  description: The link of the banner
                  type: string
                name:
                  description: The name of the banner
                  type: string
                orden:
                  description: The orden of the banner
                  type: number
                state:
                  description: The state of the banner
                  type: boolean
              required:
                - name
                - image
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Banner'
          description: The banner created
      security:
        - BearerAuth: []
      summary: Creates a new banner
      tags:
        - Banner
  /api/banner/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  description: The id of the banner
                  type: number
                image:
                  description: The image of the banner
                  type: string
                link:
                  description: The link of the banner
                  type: string
                name:
                  description: The name of the banner
                  type: string
                orden:
                  description: The orden of the banner
                  type: number
                state:
                  description: The state of the banner
                  type: boolean
              required:
                - id
                - name
                - image
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Banner'
          description: The banner updated
      security:
        - BearerAuth: []
      summary: Update a Banner
      tags:
        - Banner
tags:
  - Banner
