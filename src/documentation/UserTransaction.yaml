components:
 schemas:
   UserTransaction:
     type: object
     properties:
       id:
         type: number
         description: the auto-increment id of Term
       userId:
         type: string
         description: the id of the user
       operatorId: 
         type: string
         description: the id of the operator that approved de transaction
       amount:
         type: number
         description: the amount to payment
       transactionType:
         type: enum
         description: the type of the transaction(deposit = 1, expense = 2)
       status:
         type: enum
         description: the status of the transaction(pending = 1, approved = 2, denied = 3)
     required:
       - userId
       - operatorId
       - amount
       - transactionType
       - status
     example:
       id: 1
       operatorId: 1
       amount: 3
       transactionType: 2
       status: 2
     parameters:
      id:
       in: query
       name: id
       required: true
       schema:
        type: string
        description: the UserTransaction id
tags:
  - name: UserTransaction
    description: UserTransaction endpoint
paths:
  /api/userTransaction/show:
    get:
      summary: Returns a UserTransaction element
      tags:
        - UserTransaction
      parameters:
        - $ref: '#/components/schemas/UserTransaction/parameters/id'
      responses:
        '200':
          description: the UserTransaction element
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserTransaction'
  /api/userTransaction/all:
    get:
      summary: Returns a list of UserTransaction
      tags:
        - UserTransaction
      parameters:
        - in: query
          name: pag
          schema:
            type: number
          description: the page number to fetch
        - in: query
          name: search
          schema:
            type: string
          description: the keyword to filter by name
      responses:
        '200':
          description: the list of UserTransactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserTransaction'
  /api/userTransaction/store:
    post:
      security:
      - BearerAuth: []
      summary: Creates a new userTransaction and modifies the user.balance
      tags:
        - UserTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                 type: string
                 description: the id of the user
                operatorId: 
                 type: string
                 description: the id of the operator that approved de transaction
                amount:
                 type: number
                 description: the amount to payment
                transactionType:
                 type: enum
                 description: the type of the transaction(deposit = 1, expense = 2)
                status:
                 type: enum
                 description: the status of the transaction(pending = 1, approved = 2, denied = 3)
              required:
              - userId
              - operatorId
              - amount
              - transactionType
              - status
              example:
               id: 1
               operatorId: 1
               amount: 3
               transactionType: 2
               status: 2
      responses:
        '201':
          description: the UserTransaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTransaction'
  /api/userTransaction/update:
    post:
      security:
      - BearerAuth: []
      summary: Updates an UserTransaction
      tags:
        - UserTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                 type: string
                 description: the id of the user
                operatorId: 
                 type: string
                 description: the id of the operator that approved de transaction
                amount:
                 type: number
                 description: the amount to payment
                transactionType:
                 type: enum
                 description: the type of the transaction(deposit = 1, expense = 2)
                status:
                 type: enum
                 description: the status of the transaction(pending = 1, approved = 2, denied = 3)
              required:
               - userId
               - operatorId
               - amount
               - transactionType
               - status
            example:
              id: 1
              operatorId: 1
              amount: 3
              transactionType: 2
              status: 2
      responses:
        '201':
          description: the UserTransaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTransaction'
