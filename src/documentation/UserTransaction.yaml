components:
  schemas:
    UserTransaction:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the UserTransaction id
            type: string
      properties:
        amount:
          description: the amount of the userTransaction
          type: number
        id:
          description: the id of the userTransaction
          type: number
        operatorId:
          description: the operatorId of the userTransaction
          type: string
        status:
          description: the status of the userTransaction
          type: EStatusVerify
        transactionType:
          description: the transactionType of the userTransaction
          type: EtransactionType
        userId:
          description: the userId of the userTransaction
          type: string
      required:
      - id
      - userId
      - operatorId
      - amount
      - transactionType
      - status
      type: object
paths:
  /api/userTransaction/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of userTransaction
      tags:
      - UserTransaction
  /api/userTransaction/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/UserTransaction/parameters/id'
      responses:
        '201':
          description: The UserTransaction deleted
      security:
      - BearerAuth: []
      summary: Delete a userTransaction
      tags:
      - UserTransaction
  /api/userTransaction/show:
    get:
      parameters:
      - $ref: '#/components/schemas/UserTransaction/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserTransaction'
                type: Array
          description: The list of userTransaction
      summary: Returns a userTransaction element
      tags:
      - UserTransaction
  /api/userTransaction/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  amount:
                    description: The amount of the userTransaction
                    type: number
                  status:
                    description: The status of the userTransaction
                    type: EStatusVerify
                  transactionType:
                    description: The transactionType of the userTransaction
                    type: EtransactionType
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTransaction'
          description: The userTransaction created
      security:
      - BearerAuth: []
      summary: Creates a new userTransaction
      tags:
      - UserTransaction
  /api/userTransaction/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  amount:
                    description: The amount of the userTransaction
                    type: number
                  id:
                    description: The id of the userTransaction
                    type: number
                  operatorId:
                    description: The operatorId of the userTransaction
                    type: string
                  status:
                    description: The status of the userTransaction
                    type: EStatusVerify
                  transactionType:
                    description: The transactionType of the userTransaction
                    type: EtransactionType
                  userId:
                    description: The userId of the userTransaction
                    type: string
                required:
                - phoneCode
                - name
                - regionId
                - countryId
                - icon
                - phoneNumber
                - currencyId
                - lat
                - lon
                - image
                - dni
                - accountType
                - id
                - amount
                - reference
                - userId
                - status
                - reason
                - type
                - comment
                - driverId
                - parentId
                - isClient
                - state
                - clientId
                - tripId
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTransaction'
          description: The userTransaction updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - UserTransaction
tags:
- UserTransaction
