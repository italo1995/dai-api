components:
  schemas:
    UserTransaction:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the UserTransaction id
            type: string
      properties:
        amount:
          description: the amount of the userTransaction
          type: number
        id:
          description: the id of the userTransaction
          type: number
        operatorId:
          description: the operatorId of the userTransaction
          type: string
        status:
          description: the status of the userTransaction
          type: EStatusVerify
        transactionType:
          description: the transactionType of the userTransaction
          type: EtransactionType
        userId:
          description: the userId of the userTransaction
          type: string
      required:
        - id
        - userId
        - operatorId
        - amount
        - transactionType
        - status
      type: object
paths:
  /api/userTransaction/all:
    get:
      parameters:
        - description: The page number to fetch
          in: query
          name: pag
          schema:
            type: number
        - description: The keyword to filter by name
          in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserTransaction'
                type: Array
          description: The list of userTransaction
      summary: Returns a list of userTransaction
      tags:
        - UserTransaction
  /api/userTransaction/delete:
    post:
      parameters:
        - $ref: '#/components/schemas/UserTransaction/parameters/id'
      responses:
        '200':
          description: The UserTransaction deleted
      security:
        - BearerAuth: []
      summary: Delete a userTransaction
      tags:
        - UserTransaction
  /api/userTransaction/show:
    get:
      parameters:
        - $ref: '#/components/schemas/UserTransaction/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserTransaction'
                type: Array
          description: The element of userTransaction
      summary: Returns a userTransaction element
      tags:
        - UserTransaction
  /api/userTransaction/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  description: The amount of the userTransaction
                  type: number
                status:
                  description: The status of the userTransaction
                  type: EStatusVerify
                transactionType:
                  description: The transactionType of the userTransaction
                  type: EtransactionType
              required:
                - amount
                - transactionType
                - status
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTransaction'
          description: The userTransaction created
      security:
        - BearerAuth: []
      summary: Creates a new userTransaction
      tags:
        - UserTransaction
  /api/userTransaction/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  description: The amount of the userTransaction
                  type: number
                id:
                  description: The id of the userTransaction
                  type: number
                operatorId:
                  description: The operatorId of the userTransaction
                  type: string
                status:
                  description: The status of the userTransaction
                  type: EStatusVerify
                transactionType:
                  description: The transactionType of the userTransaction
                  type: EtransactionType
                userId:
                  description: The userId of the userTransaction
                  type: string
              required:
                - id
                - userId
                - operatorId
                - amount
                - transactionType
                - status
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTransaction'
          description: The userTransaction updated
      security:
        - BearerAuth: []
      summary: Update a UserTransaction
      tags:
        - UserTransaction
tags:
  - UserTransaction
