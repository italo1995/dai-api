components:
  schemas:
    VehicleType:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the VehicleType id
            type: string
      properties:
        id:
          description: the id of the vehicleType
          type: number
        isCar:
          description: the isCar of the vehicleType
          type: boolean
        isMoto:
          description: the isMoto of the vehicleType
          type: boolean
        name:
          description: the name of the vehicleType
          type: string
        orden:
          description: the orden of the vehicleType
          type: number
      required:
        - id
        - name
      type: object
paths:
  /api/vehicleType/all:
    get:
      parameters:
        - description: The page number to fetch
          in: query
          name: pag
          schema:
            type: number
        - description: The keyword to filter by name
          in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VehicleType'
                type: Array
          description: The list of vehicleType
      summary: Returns a list of vehicleType
      tags:
        - VehicleType
  /api/vehicleType/delete:
    post:
      parameters:
        - $ref: '#/components/schemas/VehicleType/parameters/id'
      responses:
        '200':
          description: The VehicleType deleted
      security:
        - BearerAuth: []
      summary: Delete a vehicleType
      tags:
        - VehicleType
  /api/vehicleType/show:
    get:
      parameters:
        - $ref: '#/components/schemas/VehicleType/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VehicleType'
                type: Array
          description: The element of vehicleType
      summary: Returns a vehicleType element
      tags:
        - VehicleType
  /api/vehicleType/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isCar:
                  description: The isCar of the vehicleType
                  type: boolean
                isMoto:
                  description: The isMoto of the vehicleType
                  type: boolean
                name:
                  description: The name of the vehicleType
                  type: string
                orden:
                  description: The orden of the vehicleType
                  type: number
              required:
                - name
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleType'
          description: The vehicleType created
      security:
        - BearerAuth: []
      summary: Creates a new vehicleType
      tags:
        - VehicleType
  /api/vehicleType/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  description: The id of the vehicleType
                  type: number
                isCar:
                  description: The isCar of the vehicleType
                  type: boolean
                isMoto:
                  description: The isMoto of the vehicleType
                  type: boolean
                name:
                  description: The name of the vehicleType
                  type: string
                orden:
                  description: The orden of the vehicleType
                  type: number
              required:
                - id
                - name
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleType'
          description: The vehicleType updated
      security:
        - BearerAuth: []
      summary: Update a VehicleType
      tags:
        - VehicleType
tags:
  - VehicleType
