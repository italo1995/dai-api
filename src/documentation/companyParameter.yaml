components:
  schemas:
    CompanyParameter:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the CompanyParameter id
            type: string
      properties:
        id:
          description: the id of the companyParameter
          type: number
        name:
          description: the name of the companyParameter
          type: string
        type:
          description: the type of the companyParameter
          type: ETypeReview
        value:
          description: the value of the companyParameter
          type: string
      required:
        - id
        - name
        - value
      type: object
paths:
  /api/companyParameter/all:
    get:
      parameters:
        - description: The page number to fetch
          in: query
          name: pag
          schema:
            type: number
        - description: The keyword to filter by name
          in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CompanyParameter'
                type: Array
          description: The list of companyParameter
      summary: Returns a list of companyParameter
      tags:
        - CompanyParameter
  /api/companyParameter/delete:
    post:
      parameters:
        - $ref: '#/components/schemas/CompanyParameter/parameters/id'
      responses:
        '200':
          description: The CompanyParameter deleted
      security:
        - BearerAuth: []
      summary: Delete a companyParameter
      tags:
        - CompanyParameter
  /api/companyParameter/show:
    get:
      parameters:
        - $ref: '#/components/schemas/CompanyParameter/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CompanyParameter'
                type: Array
          description: The element of companyParameter
      summary: Returns a companyParameter element
      tags:
        - CompanyParameter
  /api/companyParameter/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: The name of the companyParameter
                  type: string
                type:
                  description: The type of the companyParameter
                  type: ETypeReview
                value:
                  description: The value of the companyParameter
                  type: string
              required:
                - name
                - value
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyParameter'
          description: The companyParameter created
      security:
        - BearerAuth: []
      summary: Creates a new companyParameter
      tags:
        - CompanyParameter
  /api/companyParameter/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  description: The id of the companyParameter
                  type: number
                name:
                  description: The name of the companyParameter
                  type: string
                type:
                  description: The type of the companyParameter
                  type: ETypeReview
                value:
                  description: The value of the companyParameter
                  type: string
              required:
                - id
                - name
                - value
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyParameter'
          description: The companyParameter updated
      security:
        - BearerAuth: []
      summary: Update a CompanyParameter
      tags:
        - CompanyParameter
tags:
  - CompanyParameter
