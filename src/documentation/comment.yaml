components:
  schemas:
    comment:
      type: object
      properties:
        id:
          type: string
          description: the auto-increment id of Comment
        userId:
          type: string
          description: the id of the user
        name:
          type: string
          description: the name of the comment
        description:
          type: string
          description: the description of the Comment
        parentId:
          type: string
          description: The id that relates to the children
        serviceId:
          type: string
          description: The id that relates to the services
      required:
        - userId
        - name
        - description
        - parentId
        - serviceId
      example:
        id: 1
        userId: 1234
        name: titulo del comentario
        description: comentario escrito por usuario
        parentId: 4567
        serviceId: 7890
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            type: string
            description: the Comment id
tags:
  - name: Comment
    description: Comment endpoint
paths:
  /api/comment/show:
    get:
      summary: Returns a Comment element
      tags:
        - Comment
      parameters:
        - $ref: '#/components/schemas/Comment/parameters/id'
      responses:
        '200':
          description: the Comment element
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
  /api/comment/all:
    get:
      summary: Returns a list of Comment
      tags:
        - Comment
      parameters:
        - in: query
          name: pag
          schema:
            type: number
          description: the page number to fetch
        - in: query
          name: search
          schema:
            type: string
          description: the keyword to filter by name
      responses:
        '200':
          description: the list of Comment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
  /api/comment/store:
    post:
      security:
        - BearerAuth: []
      summary: Creates a new Comment
      tags:
        - Comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: the id of the user
                name:
                  type: string
                  description: the name of the comment
                description:
                  type: string
                  description: the description of the Comment
                parentId:
                  type: string
                  description: The id that relates to the children
                serviceId:
                  type: string
                  description: The id that relates to the services
              required:
                - userId
                - name
                - description
                - parentId
                - serviceId
              example:
                id: 1
                userId: 1234
                name: titulo del comentario
                description: comentario escrito por usuario
                parentId: 4567
                serviceId: 7890
      responses:
        '201':
          description: the Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
  /api/comment/update:
    post:
      security:
        - BearerAuth: []
      summary: Updates a Comment
      tags:
        - Comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: the id of the user
                name:
                  type: string
                  description: the name of the comment
                description:
                  type: string
                  description: the description of the Comment
                parentId:
                  type: string
                  description: The id that relates to the children
                serviceId:
                  type: string
                  description: The id that relates to the services
              required:
                - userId
                - name
                - description
                - parentId
                - serviceId
              example:
                id: 1
                userId: 1234
                name: titulo del comentario
                description: comentario escrito por usuario
                parentId: 4567
                serviceId: 7890
      responses:
        '201':
          description: the Comment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
