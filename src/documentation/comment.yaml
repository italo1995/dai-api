components:
  schemas:
    Comment:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the Comment id
            type: string
      properties:
        description:
          description: the description of the comment
          type: string
        id:
          description: the id of the comment
          type: number
        name:
          description: the name of the comment
          type: string
        parentId:
          description: the parentId of the comment
          type: string | null
        serviceId:
          description: the serviceId of the comment
          type: string
        userId:
          description: the userId of the comment
          type: string
      required:
      - id
      - userId
      - name
      - description
      - parentId
      - serviceId
      type: object
paths:
  /api/comment/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      summary: Returns a list of comment
      tags:
      - Comment
  /api/comment/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/Comment/parameters/id'
      responses:
        '201':
          description: The Comment deleted
      security:
      - BearerAuth: []
      summary: Delete a comment
      tags:
      - Comment
  /api/comment/show:
    get:
      parameters:
      - $ref: '#/components/schemas/Comment/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Comment'
                type: Array
          description: The list of comment
      summary: Returns a comment element
      tags:
      - Comment
  /api/comment/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  description:
                    description: The description of the comment
                    type: string
                  name:
                    description: The name of the comment
                    type: string
                required:
                - id
                - userId
                - name
                - description
                - parentId
                - serviceId
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: The comment created
      security:
      - BearerAuth: []
      summary: Creates a new comment
      tags:
      - Comment
  /api/comment/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  description:
                    description: The description of the comment
                    type: string
                  id:
                    description: The id of the comment
                    type: number
                  name:
                    description: The name of the comment
                    type: string
                  parentId:
                    description: The parentId of the comment
                    type: string | null
                  serviceId:
                    description: The serviceId of the comment
                    type: string
                  userId:
                    description: The userId of the comment
                    type: string
                required:
                - id
                - userId
                - name
                - description
                - parentId
                - serviceId
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: The comment updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - Comment
tags:
- Comment
