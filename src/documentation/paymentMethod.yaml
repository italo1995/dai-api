components:
  schemas:
    PaymentMethod:
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            description: the PaymentMethod id
            type: string
      properties:
        accountType:
          description: the accountType of the paymentMethod
          type: string
        currencyId:
          description: the currencyId of the paymentMethod
          type: number
        dni:
          description: the dni of the paymentMethod
          type: string
        email:
          description: the email of the paymentMethod
          type: string | null
        fullName:
          description: the fullName of the paymentMethod
          type: string
        id:
          description: the id of the paymentMethod
          type: number
        image:
          description: the image of the paymentMethod
          type: string
        name:
          description: the name of the paymentMethod
          type: string
        numberAccount:
          description: the numberAccount of the paymentMethod
          type: string
        tax:
          description: the tax of the paymentMethod
          type: number
      required:
      - id
      - fullName
      - image
      - currencyId
      type: object
paths:
  /api/paymentMethod/all:
    get:
      parameters:
      - description: The page number to fetch
        in: query
        name: pag
        schema:
          type: number
      - description: The keyword to filter by name
        in: query
        name: search
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PaymentMethod'
                type: Array
          description: The list of paymentMethod
      summary: Returns a list of paymentMethod
      tags:
      - PaymentMethod
  /api/paymentMethod/delete:
    post:
      parameters:
      - $ref: '#/components/schemas/PaymentMethod/parameters/id'
      responses:
        '201':
          description: The PaymentMethod deleted
      security:
      - BearerAuth: []
      summary: Delete a paymentMethod
      tags:
      - PaymentMethod
  /api/paymentMethod/show:
    get:
      parameters:
      - $ref: '#/components/schemas/PaymentMethod/parameters/id'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PaymentMethod'
                type: Array
          description: The element of paymentMethod
      summary: Returns a paymentMethod element
      tags:
      - PaymentMethod
  /api/paymentMethod/store:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  accountType:
                    description: The accountType of the paymentMethod
                    type: string
                  dni:
                    description: The dni of the paymentMethod
                    type: string
                  email:
                    description: The email of the paymentMethod
                    type: string | null
                  fullName:
                    description: The fullName of the paymentMethod
                    type: string
                  image:
                    description: The image of the paymentMethod
                    type: string
                  name:
                    description: The name of the paymentMethod
                    type: string
                  numberAccount:
                    description: The numberAccount of the paymentMethod
                    type: string
                  tax:
                    description: The tax of the paymentMethod
                    type: number
                required:
                - id
                - fullName
                - image
                - currencyId
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
          description: The paymentMethod created
      security:
      - BearerAuth: []
      summary: Creates a new paymentMethod
      tags:
      - PaymentMethod
  /api/paymentMethod/update:
    post:
      requestBody:
        content:
          application/json:
            schema:
              parameters:
                property:
                  accountType:
                    description: The accountType of the paymentMethod
                    type: string
                  currencyId:
                    description: The currencyId of the paymentMethod
                    type: number
                  dni:
                    description: The dni of the paymentMethod
                    type: string
                  email:
                    description: The email of the paymentMethod
                    type: string | null
                  fullName:
                    description: The fullName of the paymentMethod
                    type: string
                  id:
                    description: The id of the paymentMethod
                    type: number
                  image:
                    description: The image of the paymentMethod
                    type: string
                  name:
                    description: The name of the paymentMethod
                    type: string
                  numberAccount:
                    description: The numberAccount of the paymentMethod
                    type: string
                  tax:
                    description: The tax of the paymentMethod
                    type: number
                required:
                - id
                - fullName
                - image
                - currencyId
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
          description: The paymentMethod updated
      security:
      - BearerAuth: []
      summary: Update a update
      tags:
      - PaymentMethod
tags:
- PaymentMethod
