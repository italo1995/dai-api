components:
  schemas:
    VehicleTypes:
      type: object
      properties:
        id:
          type: number
          description: the auto-increment id of VehicleTypes
        name:
          type: string
          description: the name of the VehicleTypes
        icon:
          type: string
          description: name icon
        isMoto:
          type: boolean
          description: refers to when it is a motorcycle accessory
        isCar:
          type: boolean
          description: refers to when it is a car add-on
      required:
        - name
      example:
        id: 1
        name: sedan
      parameters:
        id:
          in: query
          name: id
          required: true
          schema:
            type: string
            description: the types of vehicles
tags:
  - name: VehicleTypes
    description: VehicleTypes endpoint
paths:
  /api/vehicleTypes/show:
    get:
      summary: Returns a VehicleType element
      tags:
        - VehicleTypes
      parameters:
        - $ref: '#/components/schemas/VehicleTypes/parameters/id'
      responses:
        '200':
          description: the vehicleType element
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleTypes'
  /api/vehicleTypes/all:
    get:
      summary: Returns a list of VehicleTypes
      tags:
        - VehicleTypes
      parameters:
        - in: query
          name: pag
          schema:
            type: number
          description: the page number to fetch
        - in: query
          name: search
          schema:
            type: string
          description: the keyword to filter by name
      responses:
        '200':
          description: the list of vehicleTypes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleTypes'
  /api/vehicleTypes/store:
    post:
      summary: Creates a new VehicleType
      tags:
        - VehicleTypes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: the types of vehicles
                icon:
                  type: string
                  description: name icon
                isMoto:
                  type: boolean
                  description: refers to when it is a motorcycle accessory
                isCar:
                  type: boolean
                  description: refers to when it is a car add-on
              required: -name
              example:
                name: sedan
                icon: 'storage/icono.png'
                isMoto: true
                isCar: false
      responses:
        '201':
          description: the VehicleTypes created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleTypes'
  /api/vehicleTypes/update:
    post:
      summary: Updates a VehicleType
      tags:
        - VehicleTypes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
                  description: VehicleTypes id to edit
                name:
                  type: string
                  description: the name of the VehicleTypes
                icon:
                  type: string
                  description: name icon
                isMoto:
                  type: boolean
                  description: refers to when it is a motorcycle accessory
                isCar:
                  type: boolean
                  description: refers to when it is a car add-on
              required:
                - id
                - name
              example:
                id: 1
                name: sedan
                icon: 'storage/icono.png'
                isMoto: true
                isCar: false
      responses:
        '201':
          description: the VehicleTypes updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleTypes'
