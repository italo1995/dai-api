paths:
  /api/admin/approve:
    post:
      summary: Verifica a un conductor (verifiedDriver = true)
      description: >
        Marca al usuario como conductor verificado y le notifica por push y WhatsApp.
        Implementado en AuthController.approve, pero montado bajo /api/admin.
      tags:
        - Admin
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
      responses:
        '200':
          description: Usuario verificado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  code: { type: number }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
        '500':
          description: No se encontró el usuario
tags:
  - Admin
